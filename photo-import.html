<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5B4885"><title>사진으로 제품 등록</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fbfbfd;color:#17172a;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 14px 70px}h1{font-size:24px;margin:4px 0 8px}p{color:#777286;font-size:14px;line-height:1.5}.box,.item{background:#fff;border:1px solid #e7e2ef;border-radius:18px;padding:15px;margin-top:12px}.pick,.batch{width:100%;height:52px;border:1px solid #d6cbea;background:#eee9f6;color:#5B4885;border-radius:14px;font-weight:800;font-size:15px}.batch{background:#8d7bc4;color:#fff;margin-top:14px}.batch:disabled{opacity:.4}.notice{background:#f3eff8;border-radius:14px;padding:12px;color:#625b72;font-size:12px;line-height:1.5}.status{margin:14px 0;color:#6f687e;font-size:13px}.bar{height:7px;background:#eeeaf4;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#5B4885}.item{display:grid;grid-template-columns:28px 1fr;gap:9px}.fields{display:grid;grid-template-columns:2fr 1fr 72px;gap:7px}.fields input,.fields select{width:100%;height:42px;border:1px solid #dedce8;border-radius:11px;padding:0 9px;background:#fff}.name{grid-column:1/-1}.hint{font-size:11px;color:#918b9d;margin-top:7px}.back{display:inline-block;margin-top:18px;color:#5B4885;text-decoration:none;font-weight:700}@media(max-width:480px){.fields{grid-template-columns:1fr 80px}.name{grid-column:1/-1}.cat{grid-column:1/-1}}</style></head><body><main class="wrap"><h1>사진으로 제품 등록</h1><p>사진·영수증·온라인 주문내역에서 제품 후보를 찾은 뒤, 직접 확인·수정해서 한 번에 등록합니다.</p><div class="notice">현재 인식 엔진은 보조 기능입니다. 오타나 누락이 있을 수 있으므로 체크된 제품명·용량·수량을 확인한 뒤 등록해주세요. 원본 이미지는 앱 재고에 저장하지 않습니다.</div><section class="box"><button class="pick" id="pick">사진 · 영수증 · 주문내역 선택</button><input id="file" type="file" accept="image/*" hidden><div class="bar" style="margin-top:12px"><div class="fill" id="fill"></div></div><div class="status" id="status">이미지를 선택해주세요.</div><div id="results"></div><button class="batch" id="batch" disabled>선택한 제품 일괄 등록</button></section><a class="back" href="./">← 재고 목록으로 돌아가기</a></main><script>const KEY='cosmetics-inventory-v2',$=s=>document.querySelector(s),cats=['마스크/팩','토너/토너패드','세럼/앰플','크림/보습','선케어','메이크업/베이스','아이메이크업','립메이크업','헤어케어','클렌징/세안','핸드케어','바디케어/샤워','기타'];const cosmetic=/(크림|세럼|앰플|토너|패드|로션|에센스|마스크|팩|선크림|선세럼|클렌|폼|워시|오일|밤|립|틴트|마스카라|라이너|브로우|쿠션|파운데이션|팩트|파우더|베이스|프라이머|쉐딩|블러셔|트리트먼트|샴푸|컨디셔너|바디|스크럽|핸드|미스트|젤|cream|serum|ampoule|toner|lotion|mask|sunscreen|cleanser|lip|tint|cushion|foundation|shampoo)/i,noise=/(합계|총액|카드|승인|영수증|사업자|전화|주소|결제|주문|수취인|배송|구매확정|할인|쿠폰|적립|택배|송장|문의|리뷰|장바구니|교환|반품|취소|판매자|스토어|상세보기|배송조회|구매하기|선물하기|찜하기|로그인|회원가입|고객센터|이벤트|기획전|추천|베스트|랭킹|출고|등록|특가|세일|SALE|EVENT|혜택|증정|사은품|한정|최저가|BEST|HOT|NEW|타임딜|무료|상품코드|상품번호|품번|SKU|바코드)/i;function clean(v){return v.replace(/[|*_~=•·]{2,}/g,' ').replace(/\s+/g,' ').trim()}function score(v){let s=0;if(cosmetic.test(v))s+=7;if(/[가-힣]{2,}/.test(v))s+=2;if(/[A-Za-z]{3,}/.test(v))s++;if(/\d+(\.\d+)?\s*(ml|g|매|ea)/i.test(v))s+=2;if(v.length>=8&&v.length<=60)s+=2;return s}function bad(v){return v.length<4||v.length>95||noise.test(v)||/https?:|www\.|@|[₩￦]\s*[\d,.]+|[\d,.]+\s*원\b/.test(v)||(/^\s*[\d,.]+\s*(원|개|%|P)?\s*$/.test(v))}function candidates(text){let l=text.split(/\n+/).map(clean).filter(Boolean),o=[];for(let i=0;i<l.length;i++){let a=l[i];if(bad(a))continue;if(i+1<l.length&&!bad(l[i+1])&&a.length+l[i+1].length<90&&((score(a)>=3&&score(l[i+1])>=2)||cosmetic.test(a)||cosmetic.test(l[i+1]))){let j=clean(a+' '+l[i+1]);if(score(j)>=score(a)){a=j;i++}}if(score(a)>=4)o.push(a)}return [...new Set(o)].slice(0,16)}function guessCat(n){if(/립|틴트/i.test(n))return'립메이크업';if(/크림|로션/i.test(n))return'크림/보습';if(/세럼|앰플|에센스/i.test(n))return'세럼/앰플';if(/토너|패드/i.test(n))return'토너/토너패드';if(/선크림|선세럼|sunscreen/i.test(n))return'선케어';if(/마스크|팩/i.test(n))return'마스크/팩';if(/클렌|폼|워시/i.test(n))return'클렌징/세안';if(/샴푸|트리트먼트|컨디셔너/i.test(n))return'헤어케어';if(/핸드/i.test(n))return'핸드케어';if(/바디/i.test(n))return'바디케어/샤워';return'기타'}function sizeOf(n){let m=n.match(/\b\d+(?:\.\d+)?\s*(?:ml|mL|g|매|ea|EA)\b/);return m?m[0]:''}async function preprocess(f){return new Promise((res,rej)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let sc=Math.min(4,Math.max(2,1400/im.width)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,c.width,c.height);let d=x.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){let g=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];g=g<205?Math.max(0,(g-128)*1.45+128):255;d.data[i]=d.data[i+1]=d.data[i+2]=g}x.putImageData(d,0,0);URL.revokeObjectURL(u);res(c)};im.onerror=rej;im.src=u})}function draw(a){$('#results').innerHTML=a.map((n,i)=>`<div class="item"><input type="checkbox" class="chk" checked><div class="fields"><input class="name" value="${n.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><select class="cat">${cats.map(c=>`<option${c===guessCat(n)?' selected':''}>${c}</option>`).join('')}</select><input class="size" placeholder="용량" value="${sizeOf(n)}"><input class="num" type="number" min="1" value="1" aria-label="수량"></div></div>`).join('');$('#batch').disabled=!a.length}$('#pick').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('#results').innerHTML='';$('#batch').disabled=true;try{let src=await preprocess(f);let r=await Tesseract.recognize(src,'kor+eng',{logger:m=>{if(m.status==='recognizing text'){let p=Math.round((m.progress||0)*100);$('#fill').style.width=p+'%';$('#status').textContent='문자 인식 중 '+p+'%'}}});let a=candidates(r.data.text||'');$('#fill').style.width='100%';$('#status').textContent=a.length?`후보 ${a.length}개를 찾았습니다. 수정 후 필요한 항목만 체크하세요.`:'제품 후보를 찾지 못했습니다.';draw(a)}catch{$('#status').textContent='인식에 실패했습니다.';$('#fill').style.width='0'}finally{e.target.value=''}};$('#batch').onclick=()=>{let rows=[...document.querySelectorAll('.item')].filter(r=>r.querySelector('.chk').checked),data=[];try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch{}let added=0;rows.forEach((r,i)=>{let name=r.querySelector('.name').value.trim(),qty=Math.max(1,Number(r.querySelector('.num').value)||1);if(!name)return;data.push({id:'p'+Date.now()+i+Math.random().toString(16).slice(2),name,cat:r.querySelector('.cat').value,size:r.querySelector('.size').value.trim(),expiry:'',qty,initial:qty,note:'사진 인식 후 확인 등록',location:''});added++});localStorage.setItem(KEY,JSON.stringify(data));alert(`${added}개 제품을 등록했습니다.`);if(added)location.href='./'};</script></body></html>
