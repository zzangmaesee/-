<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5B4885"><title>이미지로 제품 등록</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fbfbfd;color:#17172a;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;letter-spacing:-.02em}.wrap{max-width:720px;margin:auto;padding:20px 14px 60px}h1{font-size:24px;margin:4px 0 8px}p{color:#777286;line-height:1.55;font-size:14px}.box{background:#fff;border:1px solid #e7e2ef;border-radius:20px;padding:18px;margin-top:16px}.pick{width:100%;height:54px;border:1px solid #d6cbea;background:#eee9f6;color:#5B4885;border-radius:15px;font-weight:800;font-size:16px}.types{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.types span{background:#f3eff8;color:#655b78;padding:6px 9px;border-radius:99px;font-size:12px}.status{margin:14px 0;color:#6f687e;font-size:13px}.item{display:flex;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #eeeaf4}.item span{flex:1;font-size:14px;line-height:1.35}.add{border:1px solid #d8cee9;background:#fff;color:#5B4885;border-radius:10px;padding:8px 11px;font-weight:700}.notice{background:#f3eff8;border-radius:14px;padding:12px 13px;color:#625b72;font-size:12px;line-height:1.55}.back{display:inline-block;margin-top:18px;color:#5B4885;text-decoration:none;font-weight:700}.bar{height:7px;background:#eeeaf4;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#5B4885;transition:width .2s}</style></head><body><main class="wrap"><h1>이미지로 제품 등록</h1><p>제품 사진, 영수증, 온라인몰 주문·구매내역 캡처에서 실제 상품명 가능성이 높은 항목만 추립니다.</p><div class="types"><span>제품 패키지</span><span>종이 영수증</span><span>온라인 주문내역</span><span>구매내역 캡처</span></div><div class="notice">가격·배송정보·상품코드·주문정보·광고/혜택/버튼 문구 등은 적극적으로 제외합니다. 사진은 브라우저 메모리에서만 분석하며 원본은 저장하지 않습니다. 필터를 강하게 적용하므로 누락된 제품은 직접 등록해주세요.</div><section class="box"><button class="pick" id="pick">사진 · 영수증 · 주문내역 캡처 선택</button><input id="file" type="file" accept="image/*" hidden><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">이미지를 선택해주세요.</div><div id="results"></div></section><a class="back" href="./">← 재고 목록으로 돌아가기</a></main><script>const KEY='cosmetics-inventory-v2',$=s=>document.querySelector(s);function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const ui=/(합계|총액|카드|승인|부가세|과세|면세|영수증|사업자|전화|주소|일시|금액|결제|거스름|판매|주문|주문번호|주문일|주문자|수취인|배송|배송지|배송비|배송완료|배송중|구매확정|결제완료|결제금액|할인|쿠폰|적립|포인트|택배|송장|문의|리뷰|장바구니|재구매|옵션변경|교환|반품|취소|무료배송|도착|도착예정|받는사람|연락처|개인통관|현금영수증|판매자|판매처|스토어|판매자정보|구매내역|주문내역|결제내역|상세보기|주문상세|배송조회|구매하기|선물하기|찜하기|공유|알림|로그인|회원가입|고객센터|FAQ|공지|이벤트|기획전|추천|베스트|랭킹|오늘출발|당일배송|새벽배송|묶음배송|조건부무료|배송방법|배송업체|배송메모|택배사|운송장|발송|출고)/i;const ad=/(특가|세일|SALE|EVENT|이벤트|혜택|증정|사은품|단독|한정|최대\s*\d+%|최저가|쿠폰|할인|적립|무료|BEST|베스트|추천|인기|HOT|신상|NEW|런칭|오픈|타임딜|오늘만|놓치지|지금\s*구매|구매시|구매하면|선착순|추가증정|덤증정|1\+1|2\+1|N\+1|체험단|포토리뷰|리뷰작성|회원|앱전용|카드혜택|즉시할인|무이자|청구할인|페이백)/i;const code=/(상품코드|상품번호|품번|모델번호|모델명|SKU|item\s*no|product\s*(id|code|no)|option\s*(id|code)|barcode|바코드)/i;const cosmetic=/(크림|세럼|앰플|토너|패드|로션|에센스|마스크|팩|선크림|선블록|선세럼|클렌|폼|워시|오일|밤|립|틴트|마스카라|라이너|브로우|쿠션|파운데이션|팩트|파우더|베이스|프라이머|쉐딩|블러셔|트리트먼트|샴푸|컨디셔너|바디|스크럽|핸드|미스트|스프레이|젤|balm|cream|serum|ampoule|toner|lotion|essence|mask|sunscreen|cleanser|wash|oil|lip|tint|mascara|liner|brow|cushion|foundation|primer|shampoo|treatment)/i;function reject(v){if(ui.test(v)||ad.test(v)||code.test(v))return true;if(/https?:|www\.|@/.test(v))return true;if(/[₩￦]\s*[\d,.]+|[\d,.]+\s*원\b/.test(v))return true;if(/^\s*[\d,.]+\s*(원|개|점|%|P|p)\s*$/.test(v))return true;if(/^\s*(무료|일반|택배|직배송|퀵|방문수령)\s*$/.test(v))return true;if(/^[A-Z0-9_-]{6,}$/i.test(v)&&!/[가-힣]/.test(v))return true;if(/\b[A-Z]{1,5}[-_]?[0-9]{4,}[A-Z0-9_-]*\b/i.test(v)&&!cosmetic.test(v))return true;if(/\d{2,4}[-./]\d{1,2}[-./]\d{1,2}/.test(v)&&!cosmetic.test(v))return true;if((v.match(/\d/g)||[]).length>Math.max(6,v.length*.45)&&!cosmetic.test(v))return true;return false}function score(v){let s=0;if(cosmetic.test(v))s+=6;if(/[가-힣]{2,}/.test(v))s+=2;if(/[A-Za-z]{3,}/.test(v))s+=1;if(/\b\d+(\.\d+)?\s*(ml|mL|g|매|ea|EA)\b/.test(v))s+=2;if(v.length>=7&&v.length<=55)s+=2;if(/[\[\(].+[\]\)]/.test(v))s+=1;if(v.length>75)s-=3;return s}function candidates(text){let lines=text.split(/\n+/).map(v=>v.replace(/[|*_~=]/g,' ').replace(/\s+/g,' ').trim()).filter(v=>v.length>=4&&v.length<=90).filter(v=>/[가-힣A-Za-z]/.test(v)).filter(v=>!reject(v));let ranked=[...new Set(lines)].map(v=>({v,s:score(v)})).filter(x=>x.s>=3).sort((a,b)=>b.s-a.s);return ranked.slice(0,20).map(x=>x.v)}function addProduct(name){let data=[];try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}data.push({id:'u'+Date.now()+Math.random().toString(16).slice(2),uid:name+'||||',name,cat:'기타',size:'',expiry:'',qty:1,initial:1,note:'이미지 인식 후 등록 · 정보 확인 필요',location:''});localStorage.setItem(KEY,JSON.stringify(data));alert('등록했습니다. 재고 목록에서 제품명·분류·용량·수량을 확인해주세요.')}$('#pick').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#results').innerHTML='';$('#fill').style.width='3%';$('#status').textContent='이미지를 이 기기에서 분석하고 있습니다…';try{if(!window.Tesseract)throw 0;const r=await Tesseract.recognize(f,'kor+eng',{logger:m=>{if(m.status==='recognizing text'){let p=Math.round((m.progress||0)*100);$('#fill').style.width=p+'%';$('#status').textContent='문자 인식 중 '+p+'%'}}});const a=candidates(r.data.text||'');$('#fill').style.width='100%';$('#status').textContent=a.length?`상품명 가능성이 높은 ${a.length}개 항목만 표시합니다.`:'확실한 상품명 후보를 찾지 못했습니다. 제품명 부분이 크게 보이도록 캡처하거나 직접 등록해주세요.';$('#results').innerHTML=a.map((v,i)=>`<div class="item"><span>${esc(v)}</span><button class="add" data-i="${i}">등록</button></div>`).join('');$('#results').onclick=ev=>{let b=ev.target.closest('.add');if(b)addProduct(a[+b.dataset.i])}}catch(_){$('#status').textContent='이미지 인식에 실패했습니다. 원본 이미지는 저장되지 않았습니다.';$('#fill').style.width='0'}finally{e.target.value=''}};</script></body></html>
