<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5B4885"><title>사진으로 제품 등록 · 쓰자고</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>:root{--p:#5B4885;--lp:#A78BFA;--mint:#BEE5D6}*{box-sizing:border-box}body{margin:0;background:#fff;color:#29233f;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif}.wrap{max-width:560px;margin:auto;padding:22px 18px 90px}h1{font-size:22px;text-align:center;color:#302858;margin:0 0 25px}.lead{font-size:13px;color:#696276;line-height:1.55}.chooser{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.pick{height:92px;border:1px solid #ded7eb;border-radius:15px;background:#fff;color:var(--p);font-weight:850;font-size:14px}.pick b{display:block;font-size:25px;margin-bottom:7px}.gallery{background:#f2edff}.camera{background:#eaf8f7;color:#347f79}.notice{background:#f7f4ff;border-radius:14px;padding:14px;color:#766e85;font-size:11px;line-height:1.6}.status{margin:15px 0;color:#6f687e;font-size:12px}.bar{height:7px;background:#eeeaf4;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--p);transition:width .2s}.thumbs{display:flex;gap:7px;overflow:auto;margin:12px 0}.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid #e5dfed;flex:0 0 56px}.item{background:#fff;border:1px solid #e7e2ef;border-radius:14px;padding:12px;margin-top:9px;display:grid;grid-template-columns:25px 1fr;gap:8px}.fields{display:grid;grid-template-columns:2fr 1fr 68px;gap:6px}.fields input,.fields select{width:100%;height:40px;border:1px solid #dedce8;border-radius:9px;padding:0 8px;background:#fff;font-size:12px}.name{grid-column:1/-1}.batch{width:100%;height:50px;border:0;border-radius:11px;background:var(--p);color:#fff;font-weight:850;margin-top:15px}.batch:disabled{opacity:.35}.back{display:inline-block;margin-top:18px;color:var(--p);text-decoration:none;font-weight:750;font-size:13px}.spark{position:fixed;pointer-events:none;z-index:99;color:var(--lp);animation:fly .42s ease-out forwards}@keyframes fly{to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3)}}@media(max-width:480px){.fields{grid-template-columns:1fr 72px}.name,.cat{grid-column:1/-1}}</style></head><body><main class="wrap"><h1>사진으로 여러 제품 인식</h1><p class="lead">카메라로 바로 촬영하거나 사진첩에서 여러 장을 한 번에 선택하세요. 여러 이미지의 인식 결과를 합쳐서 확인할 수 있습니다.</p><div class="chooser"><button class="pick camera" id="cameraBtn"><b>⌾</b>카메라로 촬영</button><button class="pick gallery" id="galleryBtn"><b>▧</b>사진첩에서 선택</button></div><input id="camera" type="file" accept="image/*" capture="environment" hidden><input id="gallery" type="file" accept="image/*" multiple hidden><div class="notice">사진첩은 여러 장을 동시에 선택할 수 있습니다. 카메라는 한 장씩 촬영한 뒤 다시 ‘카메라로 촬영’을 눌러 사진을 추가할 수 있습니다. 인식 결과는 반드시 제품명·용량·수량을 확인한 뒤 등록해 주세요.</div><div class="thumbs" id="thumbs"></div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">사진을 선택하거나 촬영해 주세요.</div><div id="results"></div><button class="batch" id="batch" disabled>선택한 제품 일괄 등록</button><a class="back" href="./">‹ 재고 목록으로 돌아가기</a></main><script>const KEY='cosmetics-inventory-v2',$=s=>document.querySelector(s),cats=['마스크/팩','토너/토너패드','세럼/앰플','크림/보습','선케어','메이크업/베이스','아이메이크업','립메이크업','헤어케어','클렌징/세안','핸드케어','바디케어/샤워','기타'];let all=[];const cosmetic=/(크림|세럼|앰플|토너|패드|로션|에센스|마스크|팩|선크림|선세럼|클렌|폼|워시|오일|밤|립|틴트|마스카라|라이너|브로우|쿠션|파운데이션|팩트|파우더|베이스|프라이머|쉐딩|블러셔|트리트먼트|샴푸|컨디셔너|바디|스크럽|핸드|미스트|젤|cream|serum|ampoule|toner|lotion|mask|sunscreen|cleanser|lip|tint|cushion|foundation|shampoo)/i,noise=/(합계|총액|카드|승인|영수증|사업자|전화|주소|결제|주문|수취인|배송|구매확정|할인|쿠폰|적립|택배|송장|문의|리뷰|장바구니|교환|반품|취소|판매자|스토어|상세보기|배송조회|구매하기|선물하기|찜하기|로그인|회원가입|고객센터|이벤트|기획전|추천|베스트|랭킹|출고|등록|특가|세일|SALE|EVENT|혜택|증정|사은품|한정|최저가|BEST|HOT|NEW|타임딜|무료|상품코드|상품번호|품번|SKU|바코드)/i;function clean(v){return v.replace(/[|*_~=•·]{2,}/g,' ').replace(/\s+/g,' ').trim()}function score(v){let s=0;if(cosmetic.test(v))s+=7;if(/[가-힣]{2,}/.test(v))s+=2;if(/[A-Za-z]{3,}/.test(v))s++;if(/\d+(\.\d+)?\s*(ml|g|매|ea)/i.test(v))s+=2;if(v.length>=8&&v.length<=60)s+=2;return s}function bad(v){return v.length<4||v.length>95||noise.test(v)||/https?:|www\.|@|[₩￦]\s*[\d,.]+|[\d,.]+\s*원\b/.test(v)||(/^\s*[\d,.]+\s*(원|개|%|P)?\s*$/.test(v))}function candidates(text){let l=text.split(/\n+/).map(clean).filter(Boolean),o=[];for(let i=0;i<l.length;i++){let a=l[i];if(bad(a))continue;if(i+1<l.length&&!bad(l[i+1])&&a.length+l[i+1].length<90&&((score(a)>=3&&score(l[i+1])>=2)||cosmetic.test(a)||cosmetic.test(l[i+1]))){let j=clean(a+' '+l[i+1]);if(score(j)>=score(a)){a=j;i++}}if(score(a)>=4)o.push(a)}return [...new Set(o)].slice(0,20)}function guessCat(n){if(/립|틴트/i.test(n))return'립메이크업';if(/크림|로션/i.test(n))return'크림/보습';if(/세럼|앰플|에센스/i.test(n))return'세럼/앰플';if(/토너|패드/i.test(n))return'토너/토너패드';if(/선크림|선세럼|sunscreen/i.test(n))return'선케어';if(/마스크|팩/i.test(n))return'마스크/팩';if(/클렌|폼|워시/i.test(n))return'클렌징/세안';if(/샴푸|트리트먼트|컨디셔너/i.test(n))return'헤어케어';if(/핸드/i.test(n))return'핸드케어';if(/바디/i.test(n))return'바디케어/샤워';return'기타'}function sizeOf(n){let m=n.match(/\b\d+(?:\.\d+)?\s*(?:ml|mL|g|매|ea|EA)\b/);return m?m[0]:''}async function preprocess(f){return new Promise((res,rej)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let sc=Math.min(4,Math.max(2,1400/im.width)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,c.width,c.height);let d=x.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){let g=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];g=g<205?Math.max(0,(g-128)*1.45+128):255;d.data[i]=d.data[i+1]=d.data[i+2]=g}x.putImageData(d,0,0);URL.revokeObjectURL(u);res(c)};im.onerror=rej;im.src=u})}function draw(){$('#results').innerHTML=all.map(n=>`<div class="item"><input type="checkbox" class="chk" checked><div class="fields"><input class="name" value="${n.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><select class="cat">${cats.map(c=>`<option${c===guessCat(n)?' selected':''}>${c}</option>`).join('')}</select><input class="size" placeholder="용량" value="${sizeOf(n)}"><input class="num" type="number" min="1" value="1"></div></div>`).join('');$('#batch').disabled=!all.length}async function addFiles(files){files=[...files];if(!files.length)return;for(const f of files){const u=URL.createObjectURL(f),im=document.createElement('img');im.className='thumb';im.src=u;im.onload=()=>URL.revokeObjectURL(u);$('#thumbs').appendChild(im)}let found=[];for(let i=0;i<files.length;i++){try{$('#status').textContent=`${i+1}/${files.length}번째 사진 인식 준비 중…`;let src=await preprocess(files[i]);let r=await Tesseract.recognize(src,'kor+eng',{logger:m=>{if(m.status==='recognizing text'){let p=Math.round((m.progress||0)*100),overall=Math.round(((i+p/100)/files.length)*100);$('#fill').style.width=overall+'%';$('#status').textContent=`${i+1}/${files.length}번째 사진 문자 인식 중 ${p}%`}}});found.push(...candidates(r.data.text||''))}catch{}}all=[...new Set([...all,...found])];$('#fill').style.width='100%';$('#status').textContent=all.length?`총 ${all.length}개 제품 후보를 찾았습니다. 확인 후 등록하세요.`:'제품 후보를 찾지 못했습니다. 다른 사진을 추가해 보세요.';draw()}$('#cameraBtn').onclick=()=>$('#camera').click();$('#galleryBtn').onclick=()=>$('#gallery').click();$('#camera').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('#gallery').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('#batch').onclick=()=>{let rows=[...document.querySelectorAll('.item')].filter(r=>r.querySelector('.chk').checked),data=[];try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch{}let added=0;rows.forEach((r,i)=>{let name=r.querySelector('.name').value.trim(),qty=Math.max(1,Number(r.querySelector('.num').value)||1);if(!name)return;data.push({id:'p'+Date.now()+i+Math.random().toString(16).slice(2),name,cat:r.querySelector('.cat').value,size:r.querySelector('.size').value.trim(),expiry:'',qty,initial:qty,note:'사진 인식 후 확인 등록',location:'',photo:'',inUseQty:0,openedAt:''});added++});localStorage.setItem(KEY,JSON.stringify(data));alert(`${added}개 제품을 등록했습니다.`);if(added)location.href='./'};function sparkle(e){let r=e.currentTarget.getBoundingClientRect();for(let i=0;i<3;i++){let s=document.createElement('i');s.className='spark';s.textContent=i%2?'✧':'✦';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(i-1)*22+'px');s.style.setProperty('--y',(-18-i*5)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),450)}}document.querySelectorAll('button,.back').forEach(x=>x.addEventListener('pointerdown',sparkle));</script></body></html>
