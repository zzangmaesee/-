<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5B4885"><title>대시보드 · 쓰자고</title><style>*{box-sizing:border-box}body{margin:0;background:#fbfbfd;color:#17172a;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 14px 100px}h1{font-size:22px;margin:4px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.panel{background:#fff;border:1px solid #e7e5ed;border-radius:18px;padding:16px}.num{font-size:28px;font-weight:850;color:#5B4885}.use .num{color:#24766e}.label{font-size:12px;color:#858096;margin-top:4px}.panel{margin-top:12px}.panel h2{font-size:16px;margin:0 0 12px}.barrow{display:grid;grid-template-columns:100px 1fr 36px;gap:8px;align-items:center;margin:9px 0;font-size:12px}.bar{height:9px;background:#eeeaf4;border-radius:99px;overflow:hidden}.fill{height:100%;background:#8d7bc4}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e9e7ee;display:flex;justify-content:center}.navin{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav a{height:66px;text-decoration:none;color:#817b8e;display:grid;place-items:center;font-size:12px}.nav a b{font-size:20px;line-height:1}.nav .on{color:#5B4885;font-weight:800}</style></head><body><main class="wrap"><h1>대시보드</h1><div class="grid"><div class="stat"><div class="num" id="types">0</div><div class="label">보유 제품</div></div><div class="stat"><div class="num" id="qty">0</div><div class="label">총 재고 수량</div></div><div class="stat use"><div class="num" id="using">0</div><div class="label">현재 사용중</div></div><div class="stat"><div class="num" id="stored">0</div><div class="label">미사용·보관</div></div><div class="stat"><div class="num" id="urgent">0</div><div class="label">90일 이내 만료</div></div><div class="stat"><div class="num" id="zero">0</div><div class="label">품절 제품</div></div></div><section class="panel"><h2>보관 위치별 재고</h2><div id="locs"></div></section><section class="panel"><h2>분류별 제품</h2><div id="cats"></div></section></main><nav class="nav"><div class="navin"><a href="./"><b>⌂</b><span>재고</span></a><a href="./?add=1"><b>＋</b><span>제품등록</span></a><a class="on" href="dashboard.html"><b>▥</b><span>대시보드</span></a><a href="guide.html"><b>?</b><span>사용가이드</span></a></div></nav><script>const KEY='cosmetics-inventory-v2';let d=[];try{d=JSON.parse(localStorage.getItem(KEY))||[]}catch{}function days(s){if(!s)return null;let[y,m,dd]=s.split('-').map(Number),n=new Date();return Math.round((Date.UTC(y,m-1,dd)-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000)}let total=d.reduce((n,x)=>n+(Number(x.qty)||0),0),inuse=d.reduce((n,x)=>n+Math.min(Number(x.qty)||0,Math.max(0,Number(x.inUseQty)||0)),0);types.textContent=d.length;qty.textContent=total;using.textContent=inuse;stored.textContent=Math.max(0,total-inuse);urgent.textContent=d.filter(x=>{let v=days(x.expiry);return x.qty>0&&v!==null&&v<=90}).length;zero.textContent=d.filter(x=>Number(x.qty)<=0).length;function chart(id,map){let e=document.getElementById(id),a=[...map.entries()].sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...a.map(x=>x[1]));e.innerHTML=a.length?a.map(([k,v])=>`<div class="barrow"><span>${k||'미지정'}</span><div class="bar"><div class="fill" style="width:${v/mx*100}%"></div></div><b>${v}</b></div>`).join(''):'<div class="label">아직 데이터가 없습니다.</div>'}let lm=new Map,cm=new Map;d.forEach(x=>{lm.set(x.location||'미지정',(lm.get(x.location||'미지정')||0)+(Number(x.qty)||0));cm.set(x.cat||'기타',(cm.get(x.cat||'기타')||0)+1)});chart('locs',lm);chart('cats',cm)</script></body></html>
