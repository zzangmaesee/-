<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>대시보드 · 쓰자고</title><style>:root{--p:#5B4885;--lp:#A78BFA;--pink:#EBD1DA;--yellow:#FDE7A3;--mint:#BEE5D6;--blue:#88AACA}*{box-sizing:border-box}body{margin:0;background:#fff;color:#2b2540;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif}.wrap{max-width:560px;margin:auto;padding:24px 18px 94px}h1{font-size:25px;color:#332875;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{height:112px;border-radius:15px;padding:15px;border:1px solid rgba(91,72,133,.04);position:relative}.stat:nth-child(1){background:#f0ebff}.stat:nth-child(2){background:#edf4fb}.stat:nth-child(3){background:#fcecf1}.stat:nth-child(4){background:#fff5dc}.label{font-size:12px;font-weight:800;color:#55486e}.num{font-size:31px;font-weight:900;color:#433483;margin-top:10px}.unit{font-size:12px}.ico{position:absolute;right:13px;top:13px;font-size:21px;opacity:.55}.panel{margin-top:20px}.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:900;margin-bottom:12px}.muted{font-size:11px;color:#938b9c;font-weight:500}.donutrow{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center}.donut{width:126px;height:126px;border-radius:50%;position:relative;background:#eee}.donut:after{content:'';position:absolute;inset:25px;background:#fff;border-radius:50%}.donutcenter{position:absolute;z-index:2;inset:0;display:grid;place-items:center;font-size:21px;font-weight:900;color:#352b65}.legend{font-size:11px}.leg{display:grid;grid-template-columns:10px 1fr auto;gap:6px;align-items:center;margin:7px 0}.dot{width:8px;height:8px;border-radius:50%}.barrow{display:grid;grid-template-columns:88px 1fr 42px;gap:8px;align-items:center;margin:10px 0;font-size:11px}.bar{height:9px;background:#efedf4;border-radius:99px;overflow:hidden}.fill{height:100%;background:#8066cf;border-radius:99px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ece8f1;padding-bottom:env(safe-area-inset-bottom)}.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav a{height:70px;text-decoration:none;color:#938d9d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}.nav .on{color:var(--p);font-weight:850}.navsvg{width:25px;height:25px}.nav b{font-size:23px;line-height:23px}@media(max-width:390px){.donutrow{grid-template-columns:116px 1fr}.donut{width:112px;height:112px}.barrow{grid-template-columns:78px 1fr 36px}}</style></head><body><main class="wrap"><h1>대시보드</h1><div class="grid"><div class="stat"><span class="ico">◇</span><div class="label">총 제품 종류</div><div class="num"><span id="types">0</span><span class="unit">개</span></div></div><div class="stat"><span class="ico">♧</span><div class="label">보유 수량</div><div class="num"><span id="qty">0</span><span class="unit">개</span></div></div><div class="stat"><span class="ico">◷</span><div class="label" style="color:#bd536b">15일 이내 만료</div><div class="num" style="color:#c95770"><span id="urgent">0</span><span class="unit">개</span></div></div><div class="stat"><span class="ico">□</span><div class="label" style="color:#9b7027">재고 부족</div><div class="num" style="color:#b17b28"><span id="zero">0</span><span class="unit">개</span></div></div></div><section class="panel"><div class="ptitle"><span>보관 위치별 현황</span><span class="muted">전체 ›</span></div><div class="donutrow"><div class="donut" id="donut"><div class="donutcenter"><span id="donutTotal">0개</span></div></div><div class="legend" id="locLegend"></div></div></section><section class="panel"><div class="ptitle"><span>분류별 현황</span><span class="muted">전체 ›</span></div><div id="cats"></div></section></main><nav class="nav"><div class="navin"><a href="./"><svg class="navsvg" viewBox="0 0 32 32"><path d="M7 13h18l-2 14H9L7 13Z" fill="currentColor"/><path d="M6 13h20M10 11l1-6h3v7M15 11l1-8h3l1 9M21 11l3-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>재고</span></a><a href="./?add=1"><b>＋</b><span>제품등록</span></a><a class="on" href="dashboard.html"><b>▥</b><span>대시보드</span></a><a href="guide.html"><b>♡</b><span>사용가이드</span></a></div></nav><script>const KEY='cosmetics-inventory-v2';let d=[];try{d=JSON.parse(localStorage.getItem(KEY))||[]}catch{}function days(s){if(!s)return null;let[y,m,dd]=s.split('-').map(Number),n=new Date();return Math.round((Date.UTC(y,m-1,dd)-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000)}let total=d.reduce((n,x)=>n+(Number(x.qty)||0),0);types.textContent=d.length;qty.textContent=total;urgent.textContent=d.filter(x=>{let v=days(x.expiry);return Number(x.qty)>0&&v!==null&&v>=0&&v<=15}).length;zero.textContent=d.filter(x=>Number(x.qty)<=0).length;donutTotal.textContent=total+'개';let lm=new Map,cm=new Map;d.forEach(x=>{lm.set(x.location||'미지정',(lm.get(x.location||'미지정')||0)+(Number(x.qty)||0));cm.set(x.cat||'기타',(cm.get(x.cat||'기타')||0)+1)});let la=[...lm.entries()].sort((a,b)=>b[1]-a[1]),cols=['#A78BFA','#88AACA','#BEE5D6','#FDE7A3','#EBD1DA','#c9b9ef'];if(la.length){let acc=0,parts=la.map((x,i)=>{let st=acc,pc=total?x[1]/total*100:0;acc+=pc;return `${cols[i%cols.length]} ${st}% ${acc}%`});donut.style.background=`conic-gradient(${parts.join(',')})`;locLegend.innerHTML=la.slice(0,6).map((x,i)=>`<div class="leg"><i class="dot" style="background:${cols[i%cols.length]}"></i><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}else{locLegend.innerHTML='<span class="muted">아직 데이터가 없습니다.</span>'}let ca=[...cm.entries()].sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...ca.map(x=>x[1]));cats.innerHTML=ca.length?ca.map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="bar"><div class="fill" style="width:${v/mx*100}%"></div></div><b>${v}</b></div>`).join(''):'<span class="muted">아직 데이터가 없습니다.</span>';</script></body></html>
