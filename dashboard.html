<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5B4885"><title>대시보드 · 쓰자고</title><style>:root{--p:#5B4885;--lp:#A78BFA;--pink:#EBD1DA;--yellow:#FDE7A3;--mint:#BEE5D6;--gray:#F3F4F6;--blue:#88AACA}*{box-sizing:border-box}body{margin:0;background:#fbfbfd;color:#211d2d;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 14px 100px}h1{font-size:23px;color:var(--p);margin:3px 0 5px}.sub{font-size:12px;color:#858096;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.panel{border-radius:20px;padding:17px;border:1px solid rgba(91,72,133,.08)}.stat:nth-child(1){background:#eee8ff}.stat:nth-child(2){background:#e7f0f7}.stat:nth-child(3){background:#f7e9ee}.stat:nth-child(4){background:#fff4cf}.num{font-size:30px;font-weight:900;color:var(--p)}.label{font-size:13px;color:#625b6e;margin-top:5px;font-weight:700}.hint{font-size:10px;color:#8a8392;margin-top:3px}.panel{background:#fff;margin-top:12px;box-shadow:0 5px 18px rgba(91,72,133,.045)}.panel h2{font-size:16px;margin:0 0 13px}.barrow{display:grid;grid-template-columns:100px 1fr 36px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.bar{height:10px;background:#f0edf4;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--lp);border-radius:99px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eae6ef;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.navin{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav a{height:68px;text-decoration:none;color:#8b8593;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}.nav .on{color:var(--p);font-weight:800}.navsvg{width:25px;height:25px}.navsvg *{stroke:currentColor}@media(max-width:400px){.barrow{grid-template-columns:80px 1fr 30px}}</style></head><body><main class="wrap"><h1>대시보드</h1><div class="sub">내 화장품을 한눈에 확인해요.</div><div class="grid"><div class="stat"><div class="num" id="types">0</div><div class="label">총 제품 종류</div></div><div class="stat"><div class="num" id="qty">0</div><div class="label">총 보유 수량</div></div><div class="stat"><div class="num" id="urgent">0</div><div class="label">15일 이내 만료</div><div class="hint">오늘부터 15일 이내</div></div><div class="stat"><div class="num" id="zero">0</div><div class="label">재고 0개 제품</div><div class="hint">보유 수량이 없는 제품</div></div></div><section class="panel"><h2>보관 위치별 재고</h2><div id="locs"></div></section><section class="panel"><h2>분류별 제품</h2><div id="cats"></div></section></main><nav class="nav"><div class="navin"><a href="./"><svg class="navsvg" viewBox="0 0 32 32" fill="none"><path d="M8 13h16l-1.5 14h-13L8 13Z" fill="currentColor" stroke="currentColor"/><path d="M6.5 13h19M11 11l1-6h3v7M16 11l1-8h3l1 9M21 11l2-5" stroke-width="2" stroke-linecap="round"/></svg><span>재고</span></a><a href="./?add=1"><b style="font-size:24px">＋</b><span>제품등록</span></a><a class="on" href="dashboard.html"><b style="font-size:21px">▥</b><span>대시보드</span></a><a href="guide.html"><b style="font-size:21px">?</b><span>사용가이드</span></a></div></nav><script>const KEY='cosmetics-inventory-v2';let d=[];try{d=JSON.parse(localStorage.getItem(KEY))||[]}catch{}function days(s){if(!s)return null;let[y,m,dd]=s.split('-').map(Number),n=new Date();return Math.round((Date.UTC(y,m-1,dd)-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000)}let total=d.reduce((n,x)=>n+(Number(x.qty)||0),0);types.textContent=d.length;qty.textContent=total;urgent.textContent=d.filter(x=>{let v=days(x.expiry);return Number(x.qty)>0&&v!==null&&v>=0&&v<=15}).length;zero.textContent=d.filter(x=>Number(x.qty)<=0).length;function chart(id,map){let e=document.getElementById(id),a=[...map.entries()].sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...a.map(x=>x[1]));e.innerHTML=a.length?a.map(([k,v])=>`<div class="barrow"><span>${k||'미지정'}</span><div class="bar"><div class="fill" style="width:${v/mx*100}%"></div></div><b>${v}</b></div>`).join(''):'<div class="label">아직 데이터가 없습니다.</div>'}let lm=new Map,cm=new Map;d.forEach(x=>{lm.set(x.location||'미지정',(lm.get(x.location||'미지정')||0)+(Number(x.qty)||0));cm.set(x.cat||'기타',(cm.get(x.cat||'기타')||0)+1)});chart('locs',lm);chart('cats',cm)</script></body></html>
