<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>대시보드 · 쓰자고</title><style>:root{--p:#5B4885;--lp:#A78BFA;--pink:#EBD1DA;--yellow:#FDE7A3;--mint:#BEE5D6;--blue:#88AACA}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}*{box-sizing:border-box}body{margin:0;background:#fff;color:#2b2540;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif;overflow-x:hidden}.wrap{max-width:560px;margin:auto;padding:25px 20px 94px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}h1{font-size:25px;color:#332875;margin:0;font-weight:900}.cal{font-size:23px;color:#4c3c91}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{height:112px;border-radius:14px;padding:15px;position:relative}.stat:nth-child(1){background:#f0ebff}.stat:nth-child(2){background:#edf4fb}.stat:nth-child(3){background:#fcecf1}.stat:nth-child(4){background:#fff5dc}.label{font-size:12px;font-weight:850;color:#55486e}.num{font-size:31px;font-weight:900;color:#433483;margin-top:10px}.unit{font-size:12px}.ico{position:absolute;right:14px;top:13px;width:22px;height:22px;opacity:.55;color:#5B4885}.panel{margin-top:23px}.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:900;margin-bottom:13px}.muted{font-size:11px;color:#938b9c;font-weight:500}.donutrow{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center}.donut{width:126px;height:126px;border-radius:50%;position:relative;background:#eee}.donut:after{content:'';position:absolute;inset:21px;background:#fff;border-radius:50%}.donutcenter{position:absolute;z-index:2;inset:0;display:grid;place-items:center;font-size:21px;font-weight:900;color:#352b65}.legend{font-size:11px}.leg{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;margin:8px 0}.leg small{color:#9a94a3;font-weight:600;font-size:10px}.dot{width:8px;height:8px;border-radius:50%}.barrow{display:grid;grid-template-columns:86px 1fr 52px;gap:8px;align-items:center;margin:11px 0;font-size:11px}.barrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.barrow b{text-align:right;font-size:11px}.barrow b small{color:#9a94a3;font-weight:600}.bar{height:9px;background:#efedf4;border-radius:99px;overflow:hidden}.fill{height:100%;background:#8066cf;border-radius:99px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ece8f1;padding-bottom:env(safe-area-inset-bottom);z-index:20}.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav a{height:70px;text-decoration:none;color:#938d9d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;position:relative}.nav .on{color:var(--p);font-weight:850}.navsvg{width:25px;height:25px}.nav b{font-size:23px;line-height:23px}.spark{position:fixed;z-index:999;pointer-events:none;top:0;left:0;transform:translate(-50%,-50%) scale(0);opacity:0;will-change:transform,opacity}.spark svg{width:100%;height:100%;display:block}@media(max-width:390px){.donutrow{grid-template-columns:116px 1fr}.donut{width:112px;height:112px}.donut:after{inset:19px}.barrow{grid-template-columns:70px 1fr 48px}}</style></head><body><main class="wrap"><div class="top"><h1>대시보드</h1></div><div class="grid"><div class="stat"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg></span><div class="label">총 제품 종류</div><div class="num"><span id="types">0</span><span class="unit">개</span></div></div><div class="stat"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg></span><div class="label">보유 수량</div><div class="num"><span id="qty">0</span><span class="unit">개</span></div></div><div class="stat"><span class="ico" style="color:#c95770"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span><div class="label" style="color:#bd536b">15일 이내 만료</div><div class="num" style="color:#c95770"><span id="urgent">0</span><span class="unit">개</span></div></div><div class="stat"><span class="ico" style="color:#b17b28"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v5M12 16h.01"/></svg></span><div class="label" style="color:#9b7027">재고 부족<br><small>(수량 0개)</small></div><div class="num" style="color:#b17b28"><span id="zero">0</span><span class="unit">개</span></div></div></div><section class="panel"><div class="ptitle"><span>보관 위치별 현황</span><span class="muted">전체 ›</span></div><div class="donutrow"><div class="donut" id="donut"><div class="donutcenter"><span id="donutTotal">0개</span></div></div><div class="legend" id="locLegend"></div></div></section><section class="panel"><div class="ptitle"><span>분류별 현황</span><span class="muted">전체 ›</span></div><div id="cats"></div></section></main><nav class="nav"><div class="navin"><a href="./"><svg class="navsvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8c0-2.1 1.3-3.6 3-3.6s3 1.5 3 3.6"/><path d="M4.3 8.4h15.4"/><path d="M5 9.2h14l-1 8.3a1.9 1.9 0 0 1-1.9 1.7H7.9A1.9 1.9 0 0 1 6 17.5L5 9.2Z"/><path d="M8.3 9.6l.4 7.8M12 9.6v7.8M15.7 9.6l-.4 7.8"/></svg><span>재고</span></a><a href="./?add=1"><svg class="navsvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>제품등록</span></a><a class="on" href="dashboard.html"><svg class="navsvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V11M12 19V5M19 19v-7"/></svg><span>대시보드</span></a><a href="guide.html"><svg class="navsvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c3-1 5 0 8 2v13c-3-2-5-3-8-2zM20 5c-3-1-5 0-8 2v13c3-2 5-3 8-2z"/></svg><span>사용가이드</span></a></div></nav><script>const KEY='cosmetics-inventory-v2';let d=[];try{d=JSON.parse(localStorage.getItem(KEY))||[]}catch{}function days(s){if(!s)return null;let[y,m,dd]=s.split('-').map(Number),n=new Date();return Math.round((Date.UTC(y,m-1,dd)-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000)}let total=d.reduce((n,x)=>n+(Number(x.qty)||0),0);types.textContent=d.length;qty.textContent=total;urgent.textContent=d.filter(x=>{let v=days(x.expiry);return Number(x.qty)>0&&v!==null&&v>=0&&v<=15}).length;zero.textContent=d.filter(x=>Number(x.qty)<=0).length;donutTotal.textContent=total+'개';let lm=new Map,cm=new Map;d.forEach(x=>{lm.set(x.location||'미지정',(lm.get(x.location||'미지정')||0)+(Number(x.qty)||0));cm.set(x.cat||'기타',(cm.get(x.cat||'기타')||0)+1)});let la=[...lm.entries()].sort((a,b)=>b[1]-a[1]),cols=['#A78BFA','#88AACA','#BEE5D6','#FDE7A3','#EBD1DA','#c9b9ef'];if(la.length){let acc=0,parts=la.map((x,i)=>{let st=acc,pc=total?x[1]/total*100:0;acc+=pc;return `${cols[i%cols.length]} ${st}% ${acc}%`});donut.style.background=`conic-gradient(${parts.join(',')})`;locLegend.innerHTML=la.slice(0,6).map((x,i)=>`<div class="leg"><i class="dot" style="background:${cols[i%cols.length]}"></i><span>${x[0]}</span><b>${x[1]} <small>(${total?Math.round(x[1]/total*100):0}%)</small></b></div>`).join('')}else locLegend.innerHTML='<span class="muted">아직 데이터가 없습니다.</span>';let ca=[...cm.entries()].sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...ca.map(x=>x[1]));cats.innerHTML=ca.length?ca.map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="bar"><div class="fill" style="width:${v/mx*100}%"></div></div><b>${v} <small>(${d.length?Math.round(v/d.length*100):0}%)</small></b></div>`).join(''):'<span class="muted">아직 데이터가 없습니다.</span>';function spark(e){let t=e.currentTarget,r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,n=9,colors=['#C8C2ED','#A7B8FA','#EBD1DA'],path='M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z',eases=['cubic-bezier(.19,1,.22,1)','cubic-bezier(.16,.84,.44,1)','cubic-bezier(.22,.61,.36,1)','cubic-bezier(.33,1,.68,1)'],tf=(x,y,sc)=>`translate(calc(-50% + ${x.toFixed(1)}px), calc(-50% + ${y.toFixed(1)}px)) scale(${sc.toFixed(2)})`;for(let i=0;i<n;i++){let ang=(Math.PI*2/n)*i+(Math.random()*.7-.35),dist=30+Math.random()*26,dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist,size=7+Math.random()*11,overshoot=1.15+Math.random()*.25,settle=.8+Math.random()*.3,dur=560+Math.random()*380,delay=i*(6+Math.random()*7)+Math.random()*40,ease=eases[Math.floor(Math.random()*eases.length)],s=document.createElement('i');s.className='spark';s.style.left=cx+'px';s.style.top=cy+'px';s.style.width=size+'px';s.style.height=size+'px';s.style.color=colors[Math.floor(Math.random()*colors.length)];s.innerHTML=`<svg viewBox="0 0 24 24"><path d="${path}" fill="currentColor"/></svg>`;document.body.appendChild(s);let anim=s.animate([{transform:tf(0,0,0),opacity:0,offset:0},{transform:tf(dx*.1,dy*.1,overshoot),opacity:1,offset:.14},{transform:tf(dx*.45,dy*.45,settle),opacity:1,offset:.42},{transform:tf(dx*.8,dy*.8,settle*.5),opacity:.85,offset:.74},{transform:tf(dx,dy,.05),opacity:0,offset:1}],{duration:dur,delay,easing:ease,fill:'forwards'}),done=()=>s.remove();anim.onfinish=done;setTimeout(done,dur+delay+80)}}document.querySelectorAll('.nav a').forEach(x=>x.addEventListener('pointerdown',spark));</script></body></html>
