<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5B4885"><title>버리기 전에 쓰자</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;background:#fbfbfd;color:#17172a;letter-spacing:-.02em}header{background:#fff;padding:18px 14px 12px;border-bottom:1px solid #eeeef4}.inner,.wrap{max-width:720px;margin:auto}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;border-radius:16px}.brand h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.04em}.sub{font-size:13px;color:#858298;margin-top:3px}.tools{display:flex;gap:8px;margin-top:14px}input,select,button{font:inherit}#q,select,.field input,.field select{height:45px;border:1px solid #dedce8;border-radius:14px;padding:0 12px;background:#fff;color:#29263a}#q{flex:1;min-width:0}.filters,.locations{display:flex;gap:7px;overflow:auto;padding:11px 12px;background:#fff}.filters{border-bottom:1px solid #eeeef4}.filters button,.locations button{border:1px solid #dedce8;background:#fff;color:#5f5b70;border-radius:999px;padding:9px 14px;white-space:nowrap;font-weight:650}.filters .on,.locations .on{background:#ece8f8;color:#5B4885;border-color:#d5cdef}.lochead{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 2px;max-width:720px;margin:auto}.lochead b{font-size:15px}.locadd{border:1px solid #cfc5e8;background:#fff;color:#5B4885;border-radius:11px;padding:7px 10px}.summary{padding:12px 14px;font-size:13px;color:#7e798d;max-width:720px;margin:auto}.list{padding:0 12px 96px;max-width:720px;margin:auto}.card{background:#fff;border:1px solid #e7e5ed;border-radius:18px;padding:14px;margin-bottom:11px}.top{display:flex;gap:12px}.thumb{width:72px;height:72px;flex:0 0 72px;border-radius:15px;background:#f0edf8;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.thumb svg{width:50px;height:50px}.info{flex:1;min-width:0}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.name{font-weight:750;font-size:16px;letter-spacing:-.045em;line-height:1.35}.meta,.note{font-size:12px;color:#898597;margin-top:5px}.expiry{font-size:13px;margin-top:8px;color:#4e4a5d}.loc{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:5px 8px;border-radius:9px;background:#f4f1fa;color:#625488;font-size:12px}.bar{height:9px;background:#eeeaf4;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#5B4885;border-radius:99px}.qty{font-weight:800;font-size:20px;min-width:70px;text-align:center}.step{width:50px;height:44px;border:1px solid #d8d0eb;border-radius:13px;background:#eeeaf8;color:#5B4885;font-size:24px}.step:disabled{opacity:.3}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750;white-space:nowrap}.danger{background:#fde7e8;color:#c9414a}.warn{background:#fff0c8;color:#9a6700}.ok{background:#e3f4e9;color:#2f7c51}.neutral{background:#f1f1f4;color:#777482}.edit{border:0;background:transparent;color:#8c8798;font-size:12px;padding:9px 0 0}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e9e7ee;padding:8px 12px;display:flex;gap:8px;z-index:8}.bottom button{height:48px;border:1px solid #d6cfeb;background:#fff;color:#67588f;border-radius:14px;font-weight:750}.bottom .add{flex:2;background:#8d7bc4;color:#fff;border-color:#8d7bc4}.bottom .backup{flex:1}.modal{display:none;position:fixed;inset:0;background:rgba(25,20,35,.38);z-index:20;padding:18px;overflow:auto}.modal.open{display:block}.sheet{background:#fff;border-radius:20px;padding:18px;max-width:520px;margin:25px auto}.sheet h2{margin:0 0 14px}.field{margin-bottom:11px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{height:46px;border-radius:12px;border:1px solid #ddd8e8;background:#fff;flex:1;font-weight:700}.actions .primary{background:#8d7bc4;color:#fff}.delete{color:#c9414a}.hint{font-size:11px;color:#8b8795;line-height:1.45}.empty{text-align:center;color:#918d9b;padding:45px 10px}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="inner"><div class="brand"><img src="icon.svg" alt=""><div><h1>버리기 전에 쓰자</h1><div class="sub">화장품 재고 관리</div></div></div><div class="tools"><input id="q" placeholder="제품명·분류·위치 검색"><select id="sort"><option value="expiry">유통기한순</option><option value="name">제품명순</option><option value="qty">재고 적은순</option></select></div></div></header><div class="filters" id="filters"><button class="on" data-f="all">전체</button><button data-f="urgent">임박/만료</button><button data-f="low">재구매</button><button data-f="zero">품절</button></div><div class="lochead"><b>📍 보관 위치</b><button class="locadd" id="addLoc">＋ 위치 추가</button></div><div class="locations" id="locations"></div><div class="summary" id="summary"></div><main class="list" id="list"></main><div class="bottom"><button class="add" id="add">＋ 새 제품</button><button class="backup" id="restore">복원</button><button class="backup" id="backup">백업</button><input id="restoreFile" type="file" accept="application/json,.json" hidden></div><div class="modal" id="modal"><form class="sheet" id="form"><h2 id="formTitle">새 제품 추가</h2><input type="hidden" id="editId"><div class="field"><label>제품명 *</label><input id="name" required></div><div class="grid"><div class="field"><label>분류 *</label><select id="cat"><option>마스크/팩</option><option>토너/토너패드</option><option>세럼/앰플</option><option>크림/보습</option><option>선케어</option><option>메이크업/베이스</option><option>아이메이크업</option><option>립메이크업</option><option>헤어케어</option><option>클렌징/세안</option><option>핸드케어</option><option>바디케어/샤워</option><option>기타</option></select></div><div class="field"><label>용량</label><input id="size"></div></div><div class="grid"><div class="field"><label>유통기한</label><input id="expiry" type="date"></div><div class="field"><label>수량 *</label><input id="qty" type="number" min="0" value="1"></div></div><div class="field"><label>보관 위치</label><select id="location"></select></div><div class="field"><label>메모</label><input id="note"></div><p class="hint">제품 이미지는 현재 저작권 문제가 없는 자체 아이콘을 기본 사용합니다. 공식 출처 등 재사용이 허용된 이미지 연결 기능은 다음 단계에서 추가합니다.</p><div class="actions"><button type="button" id="cancel">취소</button><button type="button" class="delete" id="delete" style="display:none">삭제</button><button class="primary">저장</button></div></form></div><script>const KEY='cosmetics-inventory-v2',LKEY='cosmetics-locations-v1';let data=[];try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}let locs=[];try{locs=JSON.parse(localStorage.getItem(LKEY))||[]}catch(e){}if(!locs.length)locs=['화장대','팬트리','화장실','보관함'];data=data.map(x=>({...x,location:x.location||''}));let filter='all',locFilter='전체';function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(LKEY,JSON.stringify(locs))}function days(s){if(!s)return null;let[y,m,d]=s.split('-').map(Number),t=Date.UTC(y,m-1,d),n=new Date(),today=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((t-today)/86400000)}function status(x){let d=days(x.expiry);if(x.qty<=0)return['품절','danger'];if(d!==null&&d<0)return['만료','danger'];if(d!==null&&d<=90)return['임박','warn'];if(!x.expiry)return['기한확인','neutral'];return['정상','ok']}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fallback(cat){let kind=(cat||'').includes('립')?'lip':(cat||'').includes('크림')?'jar':(cat||'').includes('선')?'tube':'bottle';let shapes={lip:'<rect x="20" y="25" width="24" height="31" rx="4"/><path d="M25 25V12l12-5v18"/>',jar:'<path d="M12 25h40l-4 27H16z"/><path d="M16 18h32v8H16z"/>',tube:'<path d="M18 8h28l-4 45H22z"/><path d="M24 53h16v5H24z"/>',bottle:'<rect x="17" y="20" width="30" height="38" rx="5"/><path d="M25 20v-9h14v9"/>'};return `<svg viewBox="0 0 64 64" fill="#e8e2f4" stroke="#5B4885" stroke-width="2.5">${shapes[kind]}</svg>`}function renderLocs(){let el=document.querySelector('#locations');el.innerHTML=`<button class="${locFilter==='전체'?'on':''}" data-l="전체">전체</button>`+locs.map(l=>`<button class="${locFilter===l?'on':''}" data-l="${esc(l)}">${esc(l)}</button>`).join('');let s=document.querySelector('#location'),v=s.value;s.innerHTML='<option value="">미지정</option>'+locs.map(l=>`<option>${esc(l)}</option>`).join('');if(locs.includes(v))s.value=v}function render(){renderLocs();let a=[...data],q=document.querySelector('#q').value.trim().toLowerCase();if(q)a=a.filter(x=>(x.name+' '+x.cat+' '+(x.note||'')+' '+(x.location||'')).toLowerCase().includes(q));if(locFilter!=='전체')a=a.filter(x=>x.location===locFilter);if(filter==='urgent')a=a.filter(x=>{let d=days(x.expiry);return d!==null&&d<=90});if(filter==='low')a=a.filter(x=>x.qty>0&&x.initial>1&&(x.qty<=1||x.qty/Math.max(1,x.initial)<=.2));if(filter==='zero')a=a.filter(x=>x.qty<=0);let sort=document.querySelector('#sort').value;a.sort((x,y)=>sort==='name'?x.name.localeCompare(y.name,'ko'):sort==='qty'?x.qty-y.qty:(x.expiry||'9999').localeCompare(y.expiry||'9999'));document.querySelector('#summary').textContent=`표시 ${a.length}종 · 전체 ${data.length}종 · 총 ${data.reduce((s,x)=>s+(+x.qty||0),0)}개`;let el=document.querySelector('#list');el.innerHTML=a.length?'':'<div class="empty">등록된 제품이 없습니다.</div>';a.forEach(x=>{let[st,cl]=status(x),pct=x.initial?Math.min(100,Math.round(x.qty/x.initial*100)):0,d=days(x.expiry),exp=x.expiry?x.expiry.replaceAll('-','.')+` · D${d>=0?'-':'+'}${Math.abs(d)}`:'유통기한 확인 필요',c=document.createElement('section');c.className='card';c.innerHTML=`<div class="top"><div class="thumb">${fallback(x.cat)}</div><div class="info"><div class="row"><div class="name">${esc(x.name)}</div><span class="badge ${cl}">${st}</span></div><div class="meta">${esc(x.cat)}${x.size?' · '+esc(x.size):''}</div><div class="expiry">${exp}</div>${x.location?`<div class="loc">● ${esc(x.location)}</div>`:''}</div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="row"><button class="step minus">−</button><div class="qty">${x.qty}개</div><button class="step plus">＋</button></div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<button class="edit">제품정보 수정 · 삭제</button>`;c.querySelector('.minus').disabled=x.qty<=0;c.querySelector('.minus').onclick=()=>{x.qty=Math.max(0,x.qty-1);save();render()};c.querySelector('.plus').onclick=()=>{x.qty++;if(x.qty>x.initial)x.initial=x.qty;save();render()};c.querySelector('.edit').onclick=()=>openForm(x);el.appendChild(c)})}const $=s=>document.querySelector(s),modal=$('#modal');function openForm(x){modal.classList.add('open');$('#formTitle').textContent=x?'제품정보 수정':'새 제품 추가';$('#editId').value=x?x.id:'';$('#name').value=x?x.name:'';$('#cat').value=x?x.cat:'세럼/앰플';$('#size').value=x?x.size:'';$('#expiry').value=x?x.expiry:'';$('#qty').value=x?x.qty:1;$('#note').value=x?(x.note||''):'';renderLocs();$('#location').value=x?(x.location||''):'';$('#delete').style.display=x?'block':'none'}function close(){modal.classList.remove('open')}$('#add').onclick=()=>openForm();$('#cancel').onclick=close;$('#form').onsubmit=e=>{e.preventDefault();let id=$('#editId').value,v={name:$('#name').value.trim(),cat:$('#cat').value,size:$('#size').value.trim(),expiry:$('#expiry').value,qty:Math.max(0,+$('#qty').value),location:$('#location').value,note:$('#note').value.trim()};if(id){let x=data.find(x=>String(x.id)===id);Object.assign(x,v);x.initial=Math.max(x.initial||0,x.qty)}else data.push({...v,id:'u'+Date.now(),initial:v.qty});save();close();render()};$('#delete').onclick=()=>{let id=$('#editId').value;if(confirm('이 제품을 삭제할까요?')){data=data.filter(x=>String(x.id)!==id);save();close();render()}};$('#filters').onclick=e=>{if(e.target.dataset.f){filter=e.target.dataset.f;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b===e.target));render()}};$('#locations').onclick=e=>{if(e.target.dataset.l){locFilter=e.target.dataset.l;render()}};$('#addLoc').onclick=()=>{let v=prompt('추가할 보관 위치 이름을 입력해주세요.');if(v&&(v=v.trim())&&!locs.includes(v)){locs.push(v);save();render()}};$('#q').oninput=render;$('#sort').onchange=render;$('#backup').onclick=()=>{let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='화장품재고_백업.json';a.click()};$('#restore').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x))throw 0;if(data.length&&!confirm('현재 재고를 백업 내용으로 교체할까요?'))return;data=x.map((v,i)=>({...v,id:v.id||('r'+Date.now()+i),qty:+v.qty||0,initial:Math.max(+v.initial||+v.qty||0,+v.qty||0),location:v.location||'',note:v.note||''}));save();render();alert('복원했습니다.')}catch(_){alert('올바른 백업 파일이 아닙니다.')}};save();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
