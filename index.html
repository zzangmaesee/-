<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17233c"><title>버리기 전에 쓰자</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;letter-spacing:0;background:#f7f8fa;color:#202631}header{position:sticky;top:0;background:#fff;color:#202631;padding:16px 14px 12px;z-index:5;border-bottom:1px solid #edf0f3}.inner{max-width:720px;margin:auto}h1{font-size:22px;letter-spacing:-.035em;margin:0 0 12px;font-weight:750}.tools{display:flex;gap:8px}input,select,button{font:inherit;letter-spacing:-.02em}#q,select,.field input,.field select{height:46px;border:1px solid #dfe3e8;border-radius:14px;padding:0 13px;background:#fff;font-size:15px;color:#252b35}#q{flex:1;min-width:0}.filters{display:flex;gap:7px;overflow:auto;padding:11px 12px;background:#fff;position:sticky;top:103px;z-index:4;border-bottom:1px solid #edf0f3}.filters button{border:1px solid #dfe3e8;background:#fff;color:#69717d;border-radius:999px;padding:9px 14px;white-space:nowrap;font-weight:650}.filters .on{background:#edf4fb;color:#3e668c;border-color:#cbdced}.summary{padding:12px 14px;font-size:13px;color:#8a929e;max-width:720px;margin:auto}.list{padding:0 12px 96px;max-width:720px;margin:auto}.card{background:#fff;border:1px solid #e5e8ec;border-radius:18px;padding:16px;margin-bottom:11px}.name{font-weight:700;font-size:16px;letter-spacing:-.045em;line-height:1.4}.meta{font-size:13px;color:#858d98;margin-top:5px}.expiry{font-size:13px;margin-top:9px;color:#4c5562}.bar{height:8px;background:#eef1f4;border-radius:99px;overflow:hidden;margin:12px 0 14px}.fill{height:100%;background:#a9c9e8;border-radius:99px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.qty{font-weight:750;font-size:19px;min-width:74px;text-align:center}.step{width:54px;height:46px;border:1px solid #c9ddef;border-radius:14px;background:#dcecf9;color:#3c668b;font-size:25px;font-weight:650}.step:disabled{opacity:.35}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.danger{background:#fde8e7;color:#c84b45}.warn{background:#fff2c9;color:#9c6a0b}.ok{background:#e4f4e9;color:#3e7d54}.badge:not(.danger):not(.warn):not(.ok){background:#f0f2f4;color:#737b86}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e8ebef;padding:9px 12px;display:flex;gap:8px;z-index:8}.bottom button{height:48px;border:1px solid #d8e2eb;background:#fff;color:#56616d;border-radius:14px;font-weight:700}.bottom .add{flex:2;background:#dcecf9;color:#365f84;border-color:#c9ddef}.bottom .backup{flex:1}.empty{text-align:center;color:#9299a3;padding:50px 10px}.edit{border:0;background:transparent;color:#969da7;font-size:12px;padding:10px 0 0}.modal{display:none;position:fixed;inset:0;background:rgba(20,25,35,.38);z-index:20;padding:18px;overflow:auto}.modal.open{display:block}.sheet{background:#fff;border-radius:20px;padding:18px;max-width:520px;margin:28px auto}.sheet h2{margin:0 0 14px;font-size:20px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{height:48px;border-radius:13px;border:1px solid #dfe3e8;background:#fff;font-weight:700;flex:1}.actions .primary{background:#dcecf9;color:#365f84;border-color:#c9ddef}.hint{font-size:12px;color:#858d98;line-height:1.45}.delete{color:#c84b45}.note{font-size:12px;color:#858d98;margin-top:6px}@media(max-width:420px){.grid{grid-template-columns:1fr}.filters{top:103px}}@media(min-width:700px){.filters{max-width:720px;margin:auto}}</style></head><body><header><div class="inner"><h1>버리기 전에 쓰자</h1><div class="tools"><input id="q" placeholder="제품명·분류 검색"><select id="sort"><option value="expiry">유통기한순</option><option value="name">제품명순</option><option value="qty">재고 적은순</option></select></div></div></header><div class="filters" id="filters"><button class="on" data-f="all">전체</button><button data-f="urgent">임박/만료</button><button data-f="low">재구매</button><button data-f="zero">품절</button></div><div class="summary" id="summary"></div><main class="list" id="list"></main><div class="bottom"><button class="add" id="add">＋ 새 제품</button><button class="backup" id="restore">복원</button><button class="backup" id="backup">백업</button><input id="restoreFile" type="file" accept="application/json,.json" hidden></div><div class="modal" id="modal"><form class="sheet" id="form"><h2 id="formTitle">새 제품 추가</h2><input type="hidden" id="editId"><div class="field"><label for="name">제품명 *</label><input id="name" required></div><div class="grid"><div class="field"><label for="cat">분류 *</label><select id="cat" required><option>마스크/팩</option><option>토너/토너패드</option><option>세럼/앰플</option><option>크림/보습</option><option>선케어</option><option>메이크업/베이스</option><option>아이메이크업</option><option>립메이크업</option><option>헤어케어</option><option>클렌징/세안</option><option>핸드케어</option><option>바디케어/샤워</option><option>바디 스크럽/각질</option><option>바디 진정/특수</option><option>기타</option></select></div><div class="field"><label for="size">용량</label><input id="size"></div></div><div class="grid"><div class="field"><label for="expiry">유통기한</label><input id="expiry" type="date"></div><div class="field"><label for="qty">수량 *</label><input id="qty" type="number" min="0" step="1" value="1" required></div></div><div class="field"><label for="note">메모</label><input id="note"></div><p class="hint">개인 재고는 이 기기의 브라우저에만 저장됩니다. 기기 변경 전에는 백업을 권장합니다.</p><div class="actions"><button type="button" id="cancel">취소</button><button type="button" class="delete" id="delete" style="display:none">삭제</button><button class="primary" type="submit">저장</button></div></form></div><script>const KEY='cosmetics-inventory-v2';let data=[];try{const saved=JSON.parse(localStorage.getItem(KEY));data=(saved&&Array.isArray(saved))?saved:[]}catch(e){data=[]}let filter='all';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function days(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number),t=Date.UTC(y,m-1,d),n=new Date(),today=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((t-today)/86400000)}function status(x){const d=days(x.expiry);if(x.qty<=0)return['품절','danger'];if(d!==null&&d<0)return['만료','danger'];if(d!==null&&d<=90)return['임박','warn'];if(!x.expiry)return['기한확인',''];return['정상','ok']}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let a=[...data],q=document.querySelector('#q').value.trim().toLowerCase();if(q)a=a.filter(x=>(x.name+' '+x.cat+' '+(x.note||'')).toLowerCase().includes(q));if(filter==='urgent')a=a.filter(x=>{let d=days(x.expiry);return d!==null&&d<=90});if(filter==='low')a=a.filter(x=>x.qty>0&&x.initial>1&&(x.qty<=1||x.qty/Math.max(1,x.initial)<=.2));if(filter==='zero')a=a.filter(x=>x.qty<=0);const sort=document.querySelector('#sort').value;a.sort((x,y)=>sort==='name'?x.name.localeCompare(y.name,'ko'):sort==='qty'?x.qty-y.qty:(x.expiry||'9999').localeCompare(y.expiry||'9999'));document.querySelector('#summary').textContent=`표시 ${a.length}종 · 전체 ${data.length}종 · 총 ${data.reduce((s,x)=>s+(Number(x.qty)||0),0)}개`;const el=document.querySelector('#list');el.innerHTML=a.length?'':'<div class="empty">등록된 제품이 없습니다.<br>기존 앱의 백업 파일이 있다면 아래 ‘복원’을 눌러 가져오세요.</div>';a.forEach(x=>{let[st,cl]=status(x),pct=x.initial?Math.min(100,Math.round(x.qty/x.initial*100)):0,d=days(x.expiry),exp=x.expiry?x.expiry.replaceAll('-','.')+` · D${d>=0?'-':'+'}${Math.abs(d)}`:'유통기한 확인 필요';let c=document.createElement('section');c.className='card';c.innerHTML=`<div class="row"><div style="min-width:0"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.cat)}${x.size?' · '+esc(x.size):''}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}</div><span class="badge ${cl}">${st}</span></div><div class="expiry">${exp}</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="row"><button class="step minus" type="button">−</button><div class="qty">${x.qty}개</div><button class="step plus" type="button">＋</button></div><button class="edit" type="button">제품정보 수정 · 삭제</button>`;c.querySelector('.minus').disabled=x.qty<=0;c.querySelector('.minus').onclick=()=>{x.qty=Math.max(0,x.qty-1);save();render()};c.querySelector('.plus').onclick=()=>{x.qty++;if(x.qty>x.initial)x.initial=x.qty;save();render()};c.querySelector('.edit').onclick=()=>openForm(x);el.appendChild(c)})}const modal=document.querySelector('#modal'),form=document.querySelector('#form'),formTitle=document.querySelector('#formTitle'),editId=document.querySelector('#editId'),nameEl=document.querySelector('#name'),catEl=document.querySelector('#cat'),sizeEl=document.querySelector('#size'),expiryEl=document.querySelector('#expiry'),qtyEl=document.querySelector('#qty'),noteEl=document.querySelector('#note');function openForm(x){modal.classList.add('open');formTitle.textContent=x?'제품정보 수정':'새 제품 추가';editId.value=x?x.id:'';nameEl.value=x?x.name:'';catEl.value=x?x.cat:'세럼/앰플';sizeEl.value=x?x.size:'';expiryEl.value=x?x.expiry:'';qtyEl.value=x?x.qty:1;noteEl.value=x?(x.note||''):'';document.querySelector('#delete').style.display=x?'block':'none'}function closeForm(){modal.classList.remove('open')}document.querySelector('#add').onclick=()=>openForm(null);document.querySelector('#cancel').onclick=closeForm;form.onsubmit=e=>{e.preventDefault();const id=editId.value,v={name:nameEl.value.trim(),cat:catEl.value,size:sizeEl.value.trim(),expiry:expiryEl.value,qty:Math.max(0,Number(qtyEl.value)),note:noteEl.value.trim()};if(id){const x=data.find(v=>String(v.id)===String(id));Object.assign(x,v);x.initial=Math.max(x.initial||0,x.qty)}else data.push({...v,id:'u'+Date.now(),initial:v.qty});save();closeForm();render()};document.querySelector('#delete').onclick=()=>{const id=editId.value;if(confirm('이 제품을 삭제할까요?')){data=data.filter(x=>String(x.id)!==String(id));save();closeForm();render()}};document.querySelector('#filters').onclick=e=>{if(e.target.dataset.f){filter=e.target.dataset.f;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b===e.target));render()}};document.querySelector('#q').oninput=render;document.querySelector('#sort').onchange=render;document.querySelector('#backup').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='화장품재고_백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.querySelector('#restore').onclick=()=>document.querySelector('#restoreFile').click();document.querySelector('#restoreFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x))throw 0;if(data.length&&!confirm('현재 재고를 백업 파일 내용으로 교체할까요?'))return;data=x.map((v,i)=>({...v,id:v.id||('r'+Date.now()+i),qty:Number(v.qty)||0,initial:Math.max(Number(v.initial)||Number(v.qty)||0,Number(v.qty)||0),note:v.note||''}));save();render();alert('재고를 복원했습니다.')}catch(err){alert('올바른 화장품 재고 백업 JSON 파일이 아닙니다.')}e.target.value=''};save();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
