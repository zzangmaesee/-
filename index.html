gap:9px}.usebox{padding:13px;border-radius:15px;background:#f4f8f7;border:1px solid #dbeae7;margin:5px 0 12px}.usehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.usehead b{color:#24766e}.actions{display:flex;gap:8px;margin-top:14px}.actions button,.wide{height:46px;border-radius:12px;border:1px solid #ddd8e8;background:#fff;flex:1;font-weight:700}.primary{background:#8d7bc4!important;color:#fff}.delete{color:#c9414a}.choice,.menu{display:grid;gap:8px}.choice button,.choice a,.menu button{min-height:52px;border:1px solid #ded8ea;border-radius:13px;background:#fff;color:#5B4885;text-decoration:none;padding:0 14px;font-weight:750}.choice a{display:grid;place-items:center}.menu button{text-align:left}.photoPreview{width:84px;height:84px;border-radius:14px;background:#f1eef7;object-fit:cover;display:none;margin-bottom:8px}.locguide{font-size:13px;color:#858096;line-height:1.5}.loceditrow{display:flex;gap:8px;margin-bottom:9px}.loceditrow input{flex:1;height:46px;border:1px solid #dedce8;border-radius:12px;padding:0 12px}.locminus,.locplus{width:46px;border-radius:12px;border:1px solid #d6cfeb;background:#eeeaf8;color:#5B4885;font-size:22px}.locminus{color:#c9414a;background:#fff}.locdone{width:100%;height:48px;border:0;border-radius:13px;background:#8d7bc4;color:#fff;font-weight:750}.alertitem{padding:10px 0;border-bottom:1px solid #eeeaf2;font-size:13px}@media(max-width:430px){.grid{grid-template-columns:1fr}.brand h1{font-size:19px}}</style></head><body><header><div class="inner"><div class="headrow"><div class="brand"><img src="icon.svg" alt=""><div><h1>쓰자고</h1><div class="sub">사놓고 잊지 말고, 쓰자고!</div></div></div><div class="headicons"><button class="iconbtn" id="alerts">♢</button><button class="iconbtn" id="settings">⋮</button></div></div><div class="tools"><input id="q" placeholder="제품명·분류·위치 검색"><select id="sort"><option value="expiry">유통기한순</option><option value="name">제품명순</option><option value="qty">재고 적은순</option></select></div></div></header><div class="lochead"><b>📍 보관 위치</b><button class="small" id="manageLoc">＋ / − 위치 편집</button></div><div class="locations" id="locations"></div><div class="summary" id="summary"></div><main class="list" id="list"></main><nav class="nav"><div class="navin"><a class="on" href="./"><b>⌂</b><span>재고</span></a><button id="navAdd"><b>＋</b><span>제품등록</span></button><a href="dashboard.html"><b>▥</b><span>대시보드</span></a><a href="guide.html"><b>?</b><span>사용가이드</span></a></div></nav><input id="restoreFile" type="file" accept="application/json,.json" hidden><div class="modal" id="addChoice"><div class="sheet"><h2>제품 등록</h2><div class="choice"><button id="manualAdd">＋ 직접 입력</button><a href="photo-import.html">📷 사진으로 여러 제품 인식</a></div><div class="actions"><button id="choiceClose">취소</button></div></div></div><div class="modal" id="modal"><form class="sheet" id="form"><h2 id="formTitle">새 제품 추가</h2><input type="hidden" id="editId"><div class="field"><label>제품명 *</label><input id="name" required></div><div class="grid"><div class="field"><label>분류 *</label><select id="cat"><option>마스크/팩</option><option>토너/토너패드</option><option>세럼/앰플</option><option>크림/보습</option><option>선케어</option><option>메이크업/베이스</option><option>아이메이크업</option><option>립메이크업</option><option>헤어케어</option><option>클렌징/세안</option><option>핸드케어</option><option>바디케어/샤워</option><option>기타</option></select></div><div class="field"><label>용량</label><input id="size"></div></div><div class="grid"><div class="field"><label>유통기한</label><input id="expiry" type="date"></div><div class="field"><label>총 수량 *</label><input id="qty" type="number" min="0" value="1"></div></div><div class="usebox"><div class="usehead"><b>● 현재 사용중</b><span class="meta">개봉·사용 상태</span></div><div class="grid"><div class="field"><label>사용중 수량</label><input id="inUseQty" type="number" min="0" value="0"></div><div class="field"><label>사용 시작일</label><input id="openedAt" type="date"></div></div><div class="meta">예: 총 3개 중 1개를 개봉했다면 사용중 수량은 1개로 입력합니다.</div></div><div class="field"><label>보관 위치</label><select id="location"></select></div><div class="field"><label>제품 사진</label><img id="photoPreview" class="photoPreview"><input id="photo" type="file" accept="image/*"><div class="meta">등록된 제품의 사진을 추가·변경할 수 있습니다.</div></div><div class="field"><label>메모</label><input id="note"></div><div class="actions"><button type="button" id="cancel">취소</button><button type="button" class="delete" id="delete" style="display:none">삭제</button><button class="primary">저장</button></div></form></div><div class="modal" id="settingsModal"><div class="sheet"><h2>설정</h2><div class="menu"><button id="backup">백업 파일 저장</button><button id="restore">백업 파일 복원</button></div><div class="actions"><button id="settingsClose">닫기</button></div></div></div><div class="modal" id="alertModal"><div class="sheet"><h2>유통기한 알림</h2><p class="locguide">유통기한 7일 전과 3일 전 제품을 확인합니다.</p><button class="wide primary" id="enableAlerts">알림 허용</button><div id="alertList"></div><div class="actions"><button id="alertClose">닫기</button></div></div></div><div class="modal" id="locModal"><div class="sheet"><h2>보관 위치 편집</h2><p class="locguide">위치명을 바로 입력·수정하세요. ＋는 새 행 추가, −는 삭제입니다.</p><div id="locEditor"></div><button class="locdone" id="locDone">완료</button></div></div><script>const KEY='cosmetics-inventory-v2',LKEY='cosmetics-locations-v1',$=s=>document.querySelector(s);let data=[],locs=[],pendingPhoto='';try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch{}try{locs=JSON.parse(localStorage.getItem(LKEY))||[]}catch{}if(!locs.length)locs=['화장대','팬트리','화장실','보관함'];data=data.map((x,i)=>({...x,id:x.id||'m'+Date.now()+i,qty:Number(x.qty)||0,initial:Math.max(Number(x.initial)||Number(x.qty)||0,Number(x.qty)||0),location:x.location||'',photo:x.photo||'',inUseQty:Math.min(Number(x.qty)||0,Math.max(0,Number(x.inUseQty)||0)),openedAt:x.openedAt||''}));let locFilter='전체';function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(LKEY,JSON.stringify(locs))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function days(s){if(!s)return null;let[y,m,d]=s.split('-').map(Number),n=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000)}function status(x){let d=days(x.expiry);if(x.qty<=0)return['품절','danger'];if(d!==null&&d<0)return['만료','danger'];if(d!==null&&d<=90)return['임박','warn'];if(!x.expiry)return['기한확인','neutral'];return['정상','ok']}function icon(cat){let k=(cat||'').includes('립')?'lip':(cat||'').includes('크림')?'jar':(cat||'').includes('선')?'tube':'bottle',z={lip:'<rect x="20" y="25" width="24" height="31" rx="4"/><path d="M25 25V12l12-5v18"/>',jar:'<path d="M12 25h40l-4 27H16z"/><path d="M16 18h32v8H16z"/>',tube:'<path d="M18 8h28l-4 45H22z"/><path d="M24 53h16v5H24z"/>',bottle:'<rect x="17" y="20" width="30" height="38" rx="5"/><path d="M25 20v-9h14v9"/>'};return `<svg viewBox="0 0 64 64" fill="#e8e2f4" stroke="#5B4885" stroke-width="2.5">${z[k]}</svg>`}function renderLocs(){if(locFilter!=='전체'&&!locs.includes(locFilter))locFilter='전체';$('#locations').innerHTML=`<button class="${locFilter==='전체'?'on':''}" data-l="전체">전체</button>`+locs.map(l=>`<button class="${locFilter===l?'on':''}" data-l="${esc(l)}">${esc(l)}</button>`).join('');let v=$('#location').value;$('#location').innerHTML='<option value="">미지정</option>'+locs.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');if(locs.includes(v))$('#location').value=v}function render(){renderLocs();let a=[...data],q=$('#q').value.trim().toLowerCase();if(q)a=a.filter(x=>(x.name+' '+x.cat+' '+(x.note||'')+' '+x.location).toLowerCase().includes(q));if(locFilter!=='전체')a=a.filter(x=>x.location===locFilter);let s=$('#sort').value;a.sort((x,y)=>s==='name'?x.name.localeCompare(y.name,'ko'):s==='qty'?x.qty-y.qty:(x.expiry||'9999').localeCompare(y.expiry||'9999'));let using=data.reduce((n,x)=>n+(Number(x.inUseQty)||0),0);$('#summary').textContent=`전체 ${data.length}종 · 총 ${data.reduce((n,x)=>n+x.qty,0)}개 · 사용중 ${using}개`;$('#list').innerHTML=a.length?'':'<div class="empty">등록된 제품이 없습니다.<br>제품등록으로 시작하세요.</div>';a.forEach(x=>{let[st,cl]=status(x),d=days(x.expiry),pct=x.initial?Math.min(100,Math.round(x.qty/x.initial*100)):0,c=document.createElement('section');c.className='card';c.innerHTML=`<div class="top"><div class="thumb">${x.photo?`<img src="${x.photo}" alt="">`:icon(x.cat)}</div><div class="info"><div class="row"><div class="name">${esc(x.name)}</div><span class="badge ${cl}">${st}</span></div><div class="meta">${esc(x.cat)}${x.size?' · '+esc(x.size):''}</div><div class="expiry">${x.expiry?x.expiry.replaceAll('-','.')+` · D${d>=0?'-':'+'}${Math.abs(d)}`:'유통기한 확인 필요'}</div><div class="chips">${x.inUseQty>0?`<span class="chip using">● 사용중 ${x.inUseQty}개${x.openedAt?' · '+x.openedAt.replaceAll('-','.')+' 시작':''}</span>`:''}${x.location?`<span class="chip">📍 ${esc(x.location)}</span>`:''}</div></div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="row"><button class="step minus">−</button><div class="qty">${x.qty}개</div><button class="step plus">＋</button></div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<button class="edit">제품정보 수정 · 삭제</button>`;c.querySelector('.minus').disabled=x.qty<=0;c.querySelector('.minus').onclick=()=>{x.qty=Math.max(0,x.qty-1);x.inUseQty=Math.min(x.inUseQty,x.qty);save();render()};c.querySelector('.plus').onclick=()=>{x.qty++;x.initial=Math.max(x.initial,x.qty);save();render()};c.querySelector('.edit').onclick=()=>openForm(x);$('#list').appendChild(c)})}const modal=$('#modal');function openForm(x){modal.classList.add('open');$('#formTitle').textContent=x?'제품정보 수정':'새 제품 추가';$('#editId').value=x?x.id:'';$('#name').value=x?x.name:'';$('#cat').value=x?x.cat:'세럼/앰플';$('#size').value=x?x.size:'';$('#expiry').value=x?x.expiry:'';$('#qty').value=x?x.qty:1;$('#inUseQty').value=x?x.inUseQty||0:0;$('#openedAt').value=x?x.openedAt||'':''
