<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5B4885"><title>버리기 전에 쓰자</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif;background:#fbfbfd;color:#17172a}header{background:#fff;padding:18px 14px 12px;border-bottom:1px solid #eeeef4}.inner,.list,.lochead,.summary{max-width:720px;margin:auto}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;border-radius:16px}.brand h1{font-size:22px;margin:0}.sub{font-size:13px;color:#858298}.tools{display:flex;gap:8px;margin-top:14px}input,select,button{font:inherit}#q,select,.field input,.field select{height:45px;border:1px solid #dedce8;border-radius:14px;padding:0 12px;background:#fff}#q{flex:1;min-width:0}.locations{display:flex;gap:7px;overflow:auto;padding:11px 12px;background:#fff}.locations button{border:1px solid #dedce8;background:#fff;color:#5f5b70;border-radius:999px;padding:9px 14px;white-space:nowrap;font-weight:650}.locations .on{background:#ece8f8;color:#5B4885;border-color:#d5cdef}.lochead{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 2px}.small{border:1px solid #cfc5e8;background:#fff;color:#5B4885;border-radius:11px;padding:7px 10px}.summary{padding:12px 14px;font-size:13px;color:#7e798d}.list{padding:0 12px 110px}.card{background:#fff;border:1px solid #e7e5ed;border-radius:18px;padding:14px;margin-bottom:11px}.top,.row{display:flex;gap:12px}.row{align-items:center;justify-content:space-between}.thumb{width:72px;height:72px;flex:0 0 72px;border-radius:15px;background:#f0edf8;display:grid;place-items:center}.thumb svg{width:50px;height:50px}.info{flex:1;min-width:0}.name{font-weight:750;font-size:16px;line-height:1.35}.meta,.note{font-size:12px;color:#898597;margin-top:5px}.expiry{font-size:13px;margin-top:8px}.loc{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:9px;background:#f4f1fa;color:#625488;font-size:12px}.bar{height:9px;background:#eeeaf4;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#5B4885}.qty{font-weight:800;font-size:20px}.step{width:50px;height:44px;border:1px solid #d8d0eb;border-radius:13px;background:#eeeaf8;color:#5B4885;font-size:24px}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750}.danger{background:#fde7e8;color:#c9414a}.warn{background:#fff0c8;color:#9a6700}.ok{background:#e3f4e9;color:#2f7c51}.neutral{background:#f1f1f4;color:#777482}.edit{border:0;background:transparent;color:#8c8798;font-size:12px;padding:9px 0 0}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e9e7ee;padding:8px 10px;display:flex;gap:6px;z-index:8}.bottom button,.bottom a{height:48px;border:1px solid #d6cfeb;background:#fff;color:#67588f;border-radius:14px;font-weight:750;display:grid;place-items:center;text-decoration:none;padding:0 10px}.bottom .add{flex:2;background:#8d7bc4;color:#fff}.bottom .minor{flex:1}.modal{display:none;position:fixed;inset:0;background:#19142361;z-index:20;padding:18px;overflow:auto}.modal.open{display:block}.sheet{background:#fff;border-radius:20px;padding:18px;max-width:520px;margin:25px auto}.field{margin-bottom:11px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{height:46px;border-radius:12px;border:1px solid #ddd8e8;background:#fff;flex:1;font-weight:700}.actions .primary{background:#8d7bc4;color:#fff}.delete{color:#c9414a}.empty{text-align:center;color:#918d9b;padding:45px 10px}.locsheet{max-width:520px}.locsheet h2{margin:0 0 6px}.locguide{font-size:13px;color:#858096;line-height:1.45;margin:0 0 14px}.loceditrow{display:flex;gap:8px;align-items:center;margin-bottom:9px}.loceditrow input{flex:1;min-width:0;height:46px;border:1px solid #dedce8;border-radius:12px;padding:0 12px;background:#fff}.locminus,.locplus{width:46px;height:46px;flex:0 0 46px;border-radius:12px;font-size:24px;font-weight:700}.locminus{border:1px solid #ead3d6;background:#fff;color:#c9414a}.locplus{border:1px solid #d6cfeb;background:#eeeaf8;color:#5B4885}.locdone{width:100%;height:48px;border:0;border-radius:13px;background:#8d7bc4;color:#fff;font-weight:750;margin-top:8px}.locempty{font-size:13px;color:#918d9b;text-align:center;padding:15px 0}@media(max-width:430px){.grid{grid-template-columns:1fr}.bottom{overflow:auto}.bottom button,.bottom a{min-width:70px}}</style></head><body><header><div class="inner"><div class="brand"><img src="icon.svg" alt=""><div><h1>버리기 전에 쓰자</h1><div class="sub">화장품 재고 관리</div></div></div><div class="tools"><input id="q" placeholder="제품명·분류·위치 검색"><select id="sort"><option value="expiry">유통기한순</option><option value="name">제품명순</option><option value="qty">재고 적은순</option></select></div></div></header><div class="lochead"><b>📍 보관 위치</b><button class="small" id="manageLoc">＋ / − 위치 편집</button></div><div class="locations" id="locations"></div><div class="summary" id="summary"></div><main class="list" id="list"></main><div class="bottom"><button class="add" id="add">＋ 새 제품</button><a class="minor" href="photo-import.html">📷 사진등록</a><button class="minor" id="restore">복원</button><button class="minor" id="backup">백업</button><input id="restoreFile" type="file" accept="application/json,.json" hidden></div><div class="modal" id="modal"><form class="sheet" id="form"><h2 id="formTitle">새 제품 추가</h2><input type="hidden" id="editId"><div class="field"><label>제품명 *</label><input id="name" required></div><div class="grid"><div class="field"><label>분류 *</label><select id="cat"><option>마스크/팩</option><option>토너/토너패드</option><option>세럼/앰플</option><option>크림/보습</option><option>선케어</option><option>메이크업/베이스</option><option>아이메이크업</option><option>립메이크업</option><option>헤어케어</option><option>클렌징/세안</option><option>핸드케어</option><option>바디케어/샤워</option><option>기타</option></select></div><div class="field"><label>용량</label><input id="size"></div></div><div class="grid"><div class="field"><label>유통기한</label><input id="expiry" type="date"></div><div class="field"><label>수량 *</label><input id="qty" type="number" min="0" value="1"></div></div><div class="field"><label>보관 위치</label><select id="location"></select></div><div class="field"><label>메모</label><input id="note"></div><div class="actions"><button type="button" id="cancel">취소</button><button type="button" class="delete" id="delete" style="display:none">삭제</button><button class="primary">저장</button></div></form></div><div class="modal" id="locModal"><div class="sheet locsheet"><h2>보관 위치 편집</h2><p class="locguide">위치명을 바로 입력·수정하세요. ＋는 새 행 추가, −는 해당 위치 삭제입니다. 이름을 바꾸면 기존 제품의 보관 위치도 함께 변경됩니다.</p><div id="locEditor"></div><button class="locdone" id="locDone">완료</button></div></div><script>const KEY='cosmetics-inventory-v2',LKEY='cosmetics-locations-v1',$=s=>document.querySelector(s);let data=[],locs=[];try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch{}try{locs=JSON.parse(localStorage.getItem(LKEY))||[]}catch{}if(!locs.length)locs=['화장대','팬트리','화장실','보관함'];data=data.map((x,i)=>({...x,id:x.id||'m'+Date.now()+i,qty:Number(x.qty)||0,initial:Math.max(Number(x.initial)||Number(x.qty)||0,Number(x.qty)||0),location:x.location||''}));let locFilter='전체';function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(LKEY,JSON.stringify(locs))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function days(s){if(!s)return null;let[y,m,d]=s.split('-').map(Number),n=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000)}function status(x){let d=days(x.expiry);if(x.qty<=0)return['품절','danger'];if(d!==null&&d<0)return['만료','danger'];if(d!==null&&d<=90)return['임박','warn'];if(!x.expiry)return['기한확인','neutral'];return['정상','ok']}function icon(cat){let k=(cat||'').includes('립')?'lip':(cat||'').includes('크림')?'jar':(cat||'').includes('선')?'tube':'bottle',z={lip:'<rect x="20" y="25" width="24" height="31" rx="4"/><path d="M25 25V12l12-5v18"/>',jar:'<path d="M12 25h40l-4 27H16z"/><path d="M16 18h32v8H16z"/>',tube:'<path d="M18 8h28l-4 45H22z"/><path d="M24 53h16v5H24z"/>',bottle:'<rect x="17" y="20" width="30" height="38" rx="5"/><path d="M25 20v-9h14v9"/>'};return `<svg viewBox="0 0 64 64" fill="#e8e2f4" stroke="#5B4885" stroke-width="2.5">${z[k]}</svg>`}function renderLocs(){if(locFilter!=='전체'&&!locs.includes(locFilter))locFilter='전체';$('#locations').innerHTML=`<button class="${locFilter==='전체'?'on':''}" data-l="전체">전체</button>`+locs.map(l=>`<button class="${locFilter===l?'on':''}" data-l="${esc(l)}">${esc(l)}</button>`).join('');let v=$('#location').value;$('#location').innerHTML='<option value="">미지정</option>'+locs.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');if(locs.includes(v))$('#location').value=v}function render(){renderLocs();let a=[...data],q=$('#q').value.trim().toLowerCase();if(q)a=a.filter(x=>(x.name+' '+x.cat+' '+(x.note||'')+' '+x.location).toLowerCase().includes(q));if(locFilter!=='전체')a=a.filter(x=>x.location===locFilter);let s=$('#sort').value;a.sort((x,y)=>s==='name'?x.name.localeCompare(y.name,'ko'):s==='qty'?x.qty-y.qty:(x.expiry||'9999').localeCompare(y.expiry||'9999'));$('#summary').textContent=`표시 ${a.length}종 · 전체 ${data.length}종 · 총 ${data.reduce((n,x)=>n+x.qty,0)}개`;$('#list').innerHTML=a.length?'':'<div class="empty">등록된 제품이 없습니다.<br>새 제품 또는 사진등록으로 시작하세요.</div>';a.forEach(x=>{let[st,cl]=status(x),d=days(x.expiry),pct=x.initial?Math.min(100,Math.round(x.qty/x.initial*100)):0,c=document.createElement('section');c.className='card';c.innerHTML=`<div class="top"><div class="thumb">${icon(x.cat)}</div><div class="info"><div class="row"><div class="name">${esc(x.name)}</div><span class="badge ${cl}">${st}</span></div><div class="meta">${esc(x.cat)}${x.size?' · '+esc(x.size):''}</div><div class="expiry">${x.expiry?x.expiry.replaceAll('-','.')+` · D${d>=0?'-':'+'}${Math.abs(d)}`:'유통기한 확인 필요'}</div>${x.location?`<div class="loc">● ${esc(x.location)}</div>`:''}</div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="row"><button class="step minus">−</button><div class="qty">${x.qty}개</div><button class="step plus">＋</button></div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<button class="edit">제품정보 수정 · 삭제</button>`;c.querySelector('.minus').disabled=x.qty<=0;c.querySelector('.minus').onclick=()=>{x.qty=Math.max(0,x.qty-1);save();render()};c.querySelector('.plus').onclick=()=>{x.qty++;x.initial=Math.max(x.initial,x.qty);save();render()};c.querySelector('.edit').onclick=()=>openForm(x);$('#list').appendChild(c)})}const modal=$('#modal');function openForm(x){modal.classList.add('open');$('#formTitle').textContent=x?'제품정보 수정':'새 제품 추가';$('#editId').value=x?x.id:'';$('#name').value=x?x.name:'';$('#cat').value=x?x.cat:'세럼/앰플';$('#size').value=x?x.size:'';$('#expiry').value=x?x.expiry:'';$('#qty').value=x?x.qty:1;$('#note').value=x?x.note||'':'';renderLocs();$('#location').value=x?x.location||'':'';$('#delete').style.display=x?'block':'none'}function close(){modal.classList.remove('open')}$('#add').onclick=()=>openForm();$('#cancel').onclick=close;$('#form').onsubmit=e=>{e.preventDefault();let id=$('#editId').value,v={name:$('#name').value.trim(),cat:$('#cat').value,size:$('#size').value.trim(),expiry:$('#expiry').value,qty:Math.max(0,Number($('#qty').value)||0),location:$('#location').value,note:$('#note').value.trim()};if(!v.name)return;if(id){let x=data.find(x=>String(x.id)===id);Object.assign(x,v);x.initial=Math.max(x.initial||0,x.qty)}else data.push({...v,id:'u'+Date.now()+Math.random().toString(16).slice(2),initial:v.qty});save();close();render()};$('#delete').onclick=()=>{let id=$('#editId').value;if(confirm('이 제품을 삭제할까요?')){data=data.filter(x=>String(x.id)!==id);save();close();render()}};$('#locations').onclick=e=>{if(e.target.dataset.l){locFilter=e.target.dataset.l;render()}};let locDraft=[];function renderLocEditor(focus=-1){let el=$('#locEditor');el.innerHTML=locDraft.length?locDraft.map((v,i)=>`<div class="loceditrow"><input class="locinput" data-i="${i}" value="${esc(v)}" placeholder="보관 위치 이름"><button class="locminus" data-del="${i}" aria-label="위치 삭제">−</button>${i===locDraft.length-1?`<button class="locplus" data-add="1" aria-label="위치 추가">＋</button>`:''}</div>`).join(''):`<div class="locempty">등록된 위치가 없습니다.</div><div class="loceditrow"><input class="locinput" data-i="0" value="" placeholder="새 보관 위치"><button class="locplus" data-add="1" aria-label="위치 추가">＋</button></div>`;if(focus>=0){let x=el.querySelector(`.locinput[data-i="${focus}"]`);if(x){x.focus();x.select()}}}function openLocEditor(){locDraft=[...locs];$('#locModal').classList.add('open');renderLocEditor()}function commitLocs(){let inputs=[...$('#locEditor').querySelectorAll('.locinput')],next=inputs.map(x=>x.value.trim()).filter(Boolean);if(new Set(next).size!==next.length)return alert('같은 보관 위치 이름을 중복해서 사용할 수 없습니다.');let old=[...locs];old.forEach((name,i)=>{let nn=next[i]||'';if(name!==nn)data.forEach(x=>{if(x.location===name)x.location=nn})});locs=next;if(locFilter!=='전체'&&!locs.includes(locFilter)){let oi=old.indexOf(locFilter);locFilter=oi>=0&&next[oi]?next[oi]:'전체'}save();$('#locModal').classList.remove('open');render()}$('#manageLoc').onclick=openLocEditor;$('#locEditor').onclick=e=>{let d=e.target.dataset.del;if(d!==undefined){let i=+d,name=locDraft[i],used=data.filter(x=>x.location===name).length;if(used&&!confirm(`「${name}」 위치를 삭제하면 ${used}개 제품의 위치가 미지정으로 변경됩니다. 삭제할까요?`))return;data.forEach(x=>{if(x.location===name)x.location=''});locDraft.splice(i,1);locs=[...locDraft];save();renderLocEditor(Math.min(i,locDraft.length-1));render();return}if(e.target.dataset.add){let inputs=[...$('#locEditor').querySelectorAll('.locinput')];locDraft=inputs.map(x=>x.value.trim());if(!locDraft.length||locDraft[locDraft.length-1])locDraft.push('');renderLocEditor(locDraft.length-1)}};$('#locEditor').oninput=e=>{if(e.target.classList.contains('locinput'))locDraft[+e.target.dataset.i]=e.target.value};$('#locDone').onclick=commitLocs;$('#locModal').onclick=e=>{if(e.target===$('#locModal'))commitLocs()};$('#q').oninput=render;$('#sort').onchange=render;$('#backup').onclick=()=>{let payload={version:2,exportedAt:new Date().toISOString(),locations:locs,products:data},b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='화장품재고_백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#restore').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let raw=JSON.parse(await f.text()),arr=Array.isArray(raw)?raw:raw.products;if(!Array.isArray(arr))throw 0;if(data.length&&!confirm('현재 재고를 백업 내용으로 교체할까요?'))return;data=arr.map((v,i)=>({...v,id:v.id||'r'+Date.now()+i,qty:Number(v.qty)||0,initial:Math.max(Number(v.initial)||Number(v.qty)||0,Number(v.qty)||0),location:v.location||'',note:v.note||''}));if(!Array.isArray(raw)&&Array.isArray(raw.locations)&&raw.locations.length)locs=[...new Set(raw.locations.map(String))];save();render();alert('재고와 보관 위치를 복원했습니다.')}catch{alert('올바른 백업 파일이 아닙니다.')}finally{e.target.value=''}};save();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
