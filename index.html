function uid(x){return[x[0],x[2],x[3],x[5]||''].join('|')}const seed=seedRaw.map((x,i)=>({id:'s'+i,uid:uid(x),name:x[0],cat:x[1],size:x[2],expiry:x[3],initial:x[4],qty:x[4],note:x[5]||''}));const KEY='cosmetics-inventory-v2',OLD='cosmetics-inventory-v1';let data=[];try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved))data=saved;else{const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old&&Array.isArray(old)){data=old.map((x,i)=>({...x,id:'old'+i,uid:[x.name,x.size,x.expiry,''].join('|'),note:x.note||''}));const have=new Set(data.map(x=>x.uid));seed.forEach(x=>{if(!have.has(x.uid))data.push(x)})}else data=JSON.parse(JSON.stringify(seed))}}catch(e){data=JSON.parse(JSON.stringify(seed))}let filter='all';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function days(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number),t=Date.UTC(y,m-1,d),n=new Date(),today=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((t-today)/86400000)}function status(x){const d=days(x.expiry);if(x.qty<=0)return['품절','danger'];if(d!==null&&d<0)return['만료','danger'];if(d!==null&&d<=90)return['임박','warn'];if(!x.expiry)return['기한확인',''];return['정상','ok']}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let a=[...data],q=document.querySelector('#q').value.trim().toLowerCase();if(q)a=a.filter(x=>(x.name+' '+x.cat+' '+(x.note||'')).toLowerCase().includes(q));if(filter==='urgent')a=a.filter(x=>{let d=days(x.expiry);return d!==null&&d<=90});if(filter==='low')a=a.filter(x=>x.qty>0&&(x.qty<=1||x.qty/Math.max(1,x.initial)<=.2));if(filter==='zero')a=a.filter(x=>x.qty<=0);const sort=document.querySelector('#sort').value;a.sort((x,y)=>sort==='name'?x.name.localeCompare(y.name,'ko'):sort==='qty'?x.qty-y.qty:(x.expiry||'9999').localeCompare(y.expiry||'9999'));document.querySelector('#summary').textContent=`표시 ${a.length}개 · 전체 ${data.length}개 · 품절 ${data.filter(x=>x.qty<=0).length}개 · 기한확인 ${data.filter(x=>!x.expiry).length}개`;const el=document.querySelector('#list');el.innerHTML=a.length?'':'<div class="empty">해당 제품이 없습니다.</div>';a.forEach(x=>{let[st,cl]=status(x),pct=x.initial?Math.min(100,Math.round(x.qty/x.initial*100)):0,d=days(x.expiry),exp=x.expiry?x.expiry.replaceAll('-','.')+` · D${d>=0?'-':'+'}${Math.abs(d)}`:'유통기한 확인 필요';let c=document.createElement('section');c.className='card';c.innerHTML=`<div class="row"><div style="min-width:0"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.cat)} · ${esc(x.size||'용량 확인 필요')}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}</div><span class="badge ${cl}">${st}</span></div><div class="expiry">${exp}</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="row"><button class="step minus" type="button">−</button><div class="qty">${x.qty}개</div><button class="step plus" type="button">＋</button></div><button class="edit" type="button">제품정보 수정 · 삭제</button>`;c.querySelector('.minus').disabled=x.qty<=0;c.querySelector('.minus').onclick=()=>{x.qty=Math.max(0,x.qty-1);save();render()};c.querySelector('.plus').onclick=()=>{x.qty++;x.initial++;save();render()};c.querySelector('.edit').onclick=()=>openForm(x);el.appendChild(c)})}function openForm(x){modal.classList.add('open');formTitle.textContent=x?'제품정보 수정':'새 제품 추가';editId.value=x?x.id:'';name.value=x?x.name:'';cat.value=x?x.cat:'세럼/앰플';size.value=x?x.size:'';expiry.value=x?x.expiry:'';qty.value=x?x.qty:1;note.value=x?(x.note||''):'';document.querySelector('#delete').style.display=x?'block':'none'}function closeForm(){modal.classList.remove('open')}add.onclick=()=>openForm(null);cancel.onclick=closeForm;modal.onclick=e=>{if(e.target.id==='modal')closeForm()};form.onsubmit=e=>{e.preventDefault();const id=editId.value,nm=name.value.trim(),ct=cat.value,sz=size.value.trim(),ex=expiry.value,q=Math.max(0,parseInt(qty.value||'0')),nt=note.value.trim();if(id){const x=data.find(v=>String(v.id)===String(id));Object.assign(x,{name:nm,cat:ct,size:sz,expiry:ex,qty:q,initial:Math.max(x.initial||0,q),note:nt,uid:[nm,sz,ex,nt].join('|')})}else data.push({id:'u'+Date.now(),uid:[nm,sz,ex,nt].join('|'),name:nm,cat:ct,size:sz,expiry:ex,qty:q,initial:q,note:nt});save();closeForm();render()};document.querySelector('#delete').onclick=()=>{const id=editId.value;if(id&&confirm('이 제품을 목록에서 삭제할까요?')){data=data.filter(x=>String(x.id)!==String(id));save();closeForm();render()}};filters.onclick=e=>{if(e.target.dataset.f){filter=e.target.dataset.f;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b===e.target));render()}};document.querySelector('#q').oninput=render;document.querySelector('#sort').onchange=render;backup.onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='화장품재고_백업.json';a.click()};save();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
