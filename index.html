<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>쓰자고</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--p:#5B4885;--lp:#A78BFA;--mint:#BEE5D6;--pink:#EBD1DA;--yellow:#FDE7A3;--blue:#88AACA;--ink:#29223f;--muted:#777184;--line:#ebe7f0}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif}button,input,select{font:inherit}.app{max-width:560px;margin:auto;padding-bottom:82px}.top{padding:18px 18px 10px;background:#fff}.titlebar{display:flex;align-items:center;justify-content:space-between;height:42px}.title{font-size:27px;font-weight:900;color:#352a77}.topicons{display:flex}.ib{width:38px;height:38px;border:0;background:none;color:#392d79;padding:7px}.ib svg,.filterbtn svg,.search svg,.nav svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.searchrow{display:grid;grid-template-columns:1fr 44px;gap:8px;margin-top:10px}.search{height:43px;border:1px solid #ebe7f1;background:#faf9fc;border-radius:11px;display:flex;align-items:center;padding:0 12px;gap:8px}.search svg{width:18px;color:#8b84a1}.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}.filterbtn{border:1px solid #e6e1ee;background:#fff;border-radius:11px;color:#665a8b;padding:11px}.locations{display:flex;gap:7px;overflow:auto;padding:9px 18px 7px}.locations button{height:35px;padding:0 15px;border-radius:18px;border:1px solid #e6e1eb;background:#fff;color:#625b71;font-size:12px;white-space:nowrap}.locations button.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:800}.stats{display:flex;gap:13px;padding:9px 18px 10px;border-bottom:1px solid #f0edf3;font-size:11px;white-space:nowrap;overflow:auto}.stats b{color:#31275f}.oktxt{color:#3d8b70}.w :#c24e69}.addloc{width:100%;height:47px;margin-top:26px;border:1px solid #a996d7;background:#fff;color:var(--p);border-radius:8px}.spark{position:fixed;z-index:99;pointer-events:none;color:#7256c2;font-size:20px;animation:burst .72s ease-out forwards}@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.15)}}</style></head><body><div class="app"><header class="top"><div class="titlebar"><div class="title">쓰자고</div><div class="topicons"><button class="ib" id="alerts"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button><button class="ib" id="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg></button></div></div><div class="searchrow"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="q" placeholder="제품명, 브랜드로 검색하세요."></label><button class="filterbtn" id="sortBtn"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg></button></div></header><div class="locations" id="locations"></div><div class="stats" id="stats"></div><main class="list" id="list"></main></div><nav class="nav"><div class="navin"><a class="on" href="./"><svg viewBox="0 0 32 32"><path d="M7 13h18l-2 14H9z" fill="currentColor"/><path d="M6 13h20M10 11l1-6h3v7M15 11l1-8h3l1 9M21 11l3-6"/></svg><span>재고</span></a><button id="navAdd"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>제품등록</span></button><a href="dashboard.html"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-7"/></svg><span>대시보드</span></a><a href="guide.html"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 5 0 8 2v13c-3-2-5-3-8-2zM20 5c-3-1-5 0-8 2v13c3-2 5-3 8-2z"/></svg><span>사용가이드</span></a></div></nav><div class="modal" id="addChoice"><section class="screen"><div class="screenhead"><button class="back" data-close="addChoice">‹</button><h2>제품 등록</h2><i></i></div><p class="choiceTitle">등록 방법을 선택하세요.</p><div class="choice"><button class="direct" id="manualAdd"><span class="choiceIcon">✎</span><span><b>직접 입력</b><small>제품 정보를 직접 입력해요.</small></span></button><a class="photos" href="photo-import.html"><span class="choiceIcon">▣</span><span><b>카메라 또는 사진으로 등록</b><small>촬영하거나 사진첩에서 여러 장을 선택해요.</small></span></a></div><div class="tip"><b>TIP</b><br>여러 제품을 한 번에 등록하고 싶다면 사진 인식을 이용해보세요!</div></section></div><div class="modal" id="formModal"><form class="screen" id="form"><div class="screenhead"><button type="button" class="back" data-close="formModal">‹</button><h2 id="formTitle">제품 정보 수정</h2><button type="button" class="trash" id="deleteBtn">⌫</button></div><input type="hidden" id="editId"><div class="field"><label>제품명</label><input id="name" required></div><div class="grid2"><div class="field"><label>분류</label><select id="cat"><option>마스크/팩</option><option>토너/토너패드</option><option>세럼/앰플</option><option>크림/보습</option><option>선케어</option><option>메이크업/베이스</option><option>아이메이크업</option><option>립메이크업</option><option>헤어케어</option><option>클렌징/세안</option><option>핸드케어</option><option>바디케어/샤워</option><option>기타</option></select></div><div class="field"><label>용량/옵션</label><input id="size"></div></div><div class="field"><label>보관 위치</label><select id="locationSel"></select></div><div class="field"><label>총 재고 수량</label><input id="qty" type="number" min="0" value="1"></div><div class="usebox"><b>사용중 수량</b><div class="quick" id="quick"></div></div><div class="field" style="margin-top:11px"><label>유통기한</label><input id="expiry" type="date"></div><div class="field"><label>제품 사진</label><input id="photo" type="file" accept="image/*"></div><div class="field"><label>메모</label><input id="note"></div><div class="actions"><button type="button" data-close="formModal">취소</button><button class="primary">저장</button></div></form></div><div class="modal" id="locModal"><section class="screen"><div class="screenhead"><button class="back" data-close="locModal">‹</button><h2>보관 위치 관리</h2><i></i></div><div id="locEditor"></div><button class="addloc" id="addLoc">＋ 새 위치 추가</button><div class="actions"><button data-close="locModal">취소</button><button class="primary" id="saveLoc">완료</button></div></section></div><script>const KEY='cosmetics-inventory-v2',LKEY='cosmetics-locations-v1',$=s=>document.querySelector(s);let data=[],locs=[],filter='전체',sort='expiry',pendingPhoto='',inUse=0;try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch{}try{locs=JSON.parse(localStorage.getItem(LKEY))||[]}catch{}if(!locs.length)locs=['화장대','팬트리','화장실','보관함'];data=data.map((x,i)=>({...x,id:x.id||'p'+Date.now()+i,qty:+x.qty||0,inUseQty:+x.inUseQty||0,photo:x.photo||''}));function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(LKEY,JSON.stringify(locs))}function days(s){if(!s)return null;let d=new Date(s+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/864e5)}function status(x){if(+x.qty<=0)return['재고 부족','soon'];let d=days(x.expiry);if(d===null)return['기한확인','check'];if(d<0)return['만료','expired'];if(d<=15)return['임박','soon'];return['정상','normal']}function renderLoc(){locations.innerHTML=['전체',...locs].map(x=>`<button class="${filter===x?'on':''}" data-loc="${x}">${x}</button>`).join('');locationSel.innerHTML=['',...locs].map(x=>`<option>${x}</option>`).join('')}function render(){renderLoc();let n=0,s=0,e=0,l=0;data.forEach(x=>{let z=status(x)[0];if(z==='정상')n++;if(z==='임박')s++;if(z==='만료')e++;if(+x.qty<=0)l++});stats.innerHTML=`<b>총 ${data.length}개</b><span class="oktxt">정상 ${n}</span><span class="warntxt">임박 ${s}</span><span class="badtxt">만료 ${e}</span><span class="badtxt">재고 부족 ${l}</span>`;let a=data.filter(x=>(filter==='전체'||x.location===filter)&&(!q.value.trim()||[x.name,x.cat,x.location].join(' ').toLowerCase().includes(q.value.trim().toLowerCase())));a.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='qty'?a.qty-b.qty:(a.expiry||'9999').localeCompare(b.expiry||'9999'));list.innerHTML=a.length?a.map(x=>{let [st,cl]=status(x),d=days(x.expiry),ex=x.expiry?x.expiry.replaceAll('-','.')+(d!==null?` (${d>=0?'D+':'D'}${Math.abs(d)})`:''):'유통기한 확인 필요';return `<article class="card"><div class="thumb">${x.photo?`<img src="${x.photo}">`:`<svg class="placeholder" viewBox="0 0 48 48"><path d="M15 14h18l2 27H13zM18 14V8h12v6"/></svg>`}</div><div class="info"><div class="name">${x.name}</div><div class="meta">${x.cat||'기타'}${x.size?' · '+x.size:''}</div><div class="exp">${ex}</div><div class="lower"><span class="badge ${cl}">${st}</span><span class="loc">⌖ ${x.location||'미지정'}</span></div></div><div class="side"><div class="qty">${x.qty}</div><div class="unit">개</div></div><button class="edit" data-edit="${x.id}">✎ 수정</button></article>`}).join(''):'<div class="empty">등록된 제품이 없습니다.</div>'}function open(id){$('#'+id).classList.add('open')}function close(id){$('#'+id).classList.remove('open')}function sparkle(t){let r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<14;i++){let s=document.createElement('i'),a=Math.PI*2*i/14,d=48+Math.random()*52;s.className='spark';s.textContent=i%2?'✦':'✧';s.style.left=cx+'px';s.style.top=cy+'px';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),760)}}locations.onclick=e=>{if(e.target.dataset.loc){filter=e.target.dataset.loc;render()}};q.oninput=render;sortBtn.onclick=()=>{sort=sort==='expiry'?'name':sort==='name'?'qty':'expiry';render()};navAdd.onclick=()=>open('addChoice');document.addEventListener('click',e=>{let c=e.target.closest('[data-close]');if(c)close(c.dataset.close);let ed=e.target.closest('[data-edit]');if(ed)edit(ed.dataset.edit)});document.addEventListener('pointerdown',e=>{let t=e.target.closest('.nav a,.nav button,.edit,.choice a,.choice button');if(t)sparkle(t)},true);manualAdd.onclick=()=>{close('addChoice');edit()};function edit(id){let x=data.find(v=>v.id===id);editId.value=id||'';formTitle.textContent=id?'제품 정보 수정':'제품 등록';name.value=x?.name||'';cat.value=x?.cat||'기타';size.value=x?.size||'';locationSel.value=x?.location||'';qty.value=x?.qty??1;expiry.value=x?.expiry||'';note.value=x?.note||'';pendingPhoto=x?.photo||'';inUse=x?.inUseQty||0;deleteBtn.style.visibility=id?'visible':'hidden';quick.innerHTML='';for(let i=0;i<=Math.min(+qty.value||0,5);i++){let b=document.createElement('button');b.type='button';b.textContent=i;b.className=i===inUse?'on':'';b.onclick=()=>{inUse=i;quick.querySelectorAll('button').forEach(z=>z.classList.toggle('on',+z.textContent===i))};quick.appendChild(b)}open('formModal')}photo.onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>pendingPhoto=rd.result;rd.readAsDataURL(f)};form.onsubmit=e=>{e.preventDefault();let id=editId.value,x={id:id||'p'+Date.now(),name:name.value.trim(),cat:cat.value,size:size.value.trim(),location:locationSel.value,qty:Math.max(0,+qty.value||0),inUseQty:Math.min(inUse,Math.max(0,+qty.value||0)),expiry:expiry.value,note:note.value.trim(),photo:pendingPhoto};if(id)data=data.map(v=>v.id===id?{...v,...x}:v);else data.push(x);save();close('formModal');render()};deleteBtn.onclick=()=>{let id=editId.value;if(id&&confirm('이 제품을 삭제할까요?')){data=data.filter(x=>x.id!==id);save();close('formModal');render()}};settings.onclick=()=>{renderLocEditor();open('locModal')};function renderLocEditor(){locEditor.innerHTML=locs.map((x,i)=>`<div class="locrow"><span>⠿</span><input value="${x}"><button class="minus" data-rm="${i}">−</button></div>`).join('')}locEditor.onclick=e=>{if(e.target.dataset.rm!==undefined){locs.splice(+e.target.dataset.rm,1);renderLocEditor()}};addLoc.onclick=()=>{locs.push('새 위치');renderLocEditor()};saveLoc.onclick=()=>{locs=[...locEditor.querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean);save();close('locModal');render()};alerts.onclick=()=>{let a=data.filter(x=>{let d=days(x.expiry);return d===7||d===3});alert(a.length?a.map(x=>`${x.name} · ${days(x.expiry)}일 전`).join('\n'):'오늘 확인할 7일 전·3일 전 제품이 없습니다.')};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');if(new URLSearchParams(location.search).get('add')==='1')open('addChoice');</script></body></html>
